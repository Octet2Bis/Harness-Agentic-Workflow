name: veille-fiche
description: |
  Bloc « veille-fiche » : transforme une ressource (reel Instagram, lien, note, PDF) en une
  fiche de veille datée et sourcée au format du pôle 03 Recherche & veille de Master Plan
  (De quoi s'agit-il, Problème, Impact, Recommandation immédiate, Sources, Limites). Il
  remplace le gabarit automatique du bot Telegram « research » (qui n'avait lu que le titre
  de la ressource) : l'agent lit le contenu réel (transcription, page), un script vérifie la
  forme (date valide, source conservée, catégorie connue, sources avec URL et date,
  recommandation qui nomme un pilier, aucune phrase de gabarit), un juge en contexte vierge
  vérifie que la fiche repose sur le contenu et pas sur le titre. Rend un verdict typé.

  Use when: a link, reel or note arrives for the second brain — "analyse ce reel", "fiche
  de veille sur", "qu'est-ce qu'on en retient".
  NOT for: deciding what to do about it (design) or a long evidence report (research).

model: medium

inputs:
  source:
    required: true
    description: The resource — a URL (reel, article, repo) or a short reference.
  content:
    default: ""
    description: The resource's actual content when the caller extracted it (transcript, page text) or an absolute path to it. Empty means the agent must read the URL itself.
  question:
    default: ""
    description: Optional question the note must answer (what we were looking for).
  categories:
    default: "IA & Systèmes Multi-Agents, UI & Animations, GTM & Growth, Dev & Outils, Carrière, Autre"
    description: Comma-separated allowed categories (those of research_graph.json).
  out:
    default: fiche.md
    description: File name of the deliverable inside the run's artifacts.

returns: { node: verdict, outcome: ok }

nodes:
  - id: produce
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ok=$check.output.ok; t=$check.output.tries; [ "$ok" = true ] || [ "$t" -ge 3 ]'
      nodes:
        - id: work
          command: work
          allowed_tools: [Read, Glob, Grep, Write, WebFetch, WebSearch]
          with:
            source: "$INPUTS.source"
            content: "$INPUTS.content"
            question: "$INPUTS.question"
            categories: "$INPUTS.categories"
            out: "$INPUTS.out"
            problems: "$LOOP_PREV.check.output.problems"
          output_format:
            type: object
            properties:
              summary: { type: string, pattern: '\S' }
              read_content: { type: boolean }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
            required: [summary, read_content, deliverable]

        - id: check
          script: check
          runtime: bun
          depends_on: [work]
          with:
            source: "$INPUTS.source"
            categories: "$INPUTS.categories"
            out: "$INPUTS.out"
            summary: "$work.output.summary"
            read_content: "$work.output.read_content"
            deliverable: { from: "$work.output.deliverable" }
            tries: "$LOOP_PREV.check.output.tries"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              summary: { type: string }
              category: { type: string }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
              tries: { type: integer, minimum: 1 }
            required: [ok, problems, summary, category, deliverable, tries]

  - id: judge
    command: judge
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Glob, Grep, WebFetch]   # lecture seule ; peut rouvrir la source pour confronter
    model: large
    depends_on: [produce]
    when: "$produce.output.ok == true"
    with:
      source: "$INPUTS.source"
      content: "$INPUTS.content"
      question: "$INPUTS.question"
      out: "$INPUTS.out"
      produced: "$produce.output"
    output_format:
      type: object
      properties:
        approved: { type: boolean }
        reason: { type: string, pattern: '\S' }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string, pattern: '\S' }
            required: [severity, text]
      required: [approved, reason, findings]

  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [produce, judge]
    trigger_rule: none_failed_min_one_success
    with:
      produced: "$produce.output"
      approved: { from: "$judge.output.approved", if_skipped: null }
      reason: { from: "$judge.output.reason", if_skipped: null }
      findings: { from: "$judge.output.findings", if_skipped: null }
    output_type: block-verdict
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [verified, rejected, unconverged] }
        summary: { type: string }
        problems: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string }
            required: [severity, text]
        deliverable:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, pattern: '\S' }
          required: [type, run_id, path]
      required: [ok, status, summary, problems, findings, deliverable]
