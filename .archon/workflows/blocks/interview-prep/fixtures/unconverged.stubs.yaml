# Issue « unconverged » : au troisième et dernier tour permis, les contrôles disent encore
# non (une histoire cite un extrait que le profil ne porte pas, un chiffre sans source). La
# boucle rend la main (compteur `tries` au plafond, pas d'épuisement de max_iterations), le
# juge est sauté (`when: $produce.output.ok == true` ; aucun stub `judge` ici : un nœud
# atteint sans stub ferait échouer le dry-run) et le verdict (script réel) rend quand même une
# issue typée : ok: false, status: unconverged, sans constats, avec les derniers problèmes. Le
# dry-run ne joue qu'un tour de boucle : le stub `check` porte directement l'état du dernier
# tour.
# attendu: ok=false status=unconverged findings=[] deliverable={"type":"archon_artifact","run_id":"fixture-run","path":"interview-prep.md"}
work:
  summary: "stub: étape manager, deux histoires seulement"
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "interview-prep.md" }
check:
  ok: false
  problems:
    - "« Histoires STAR » : 2 histoire(s), au moins 3 attendues (une par titre « ### »)"
    - "histoire « Histoire 2 — Outbound » : l'extrait « Séquences outbound à 70% de réponse » n'est pas dans le profil (citer mot pour mot)"
    - "« Histoires STAR » : le chiffre « 70% » n'est pas dans le profil (une histoire ne dit que ce que le profil porte)"
  summary: "stub: étape manager, deux histoires seulement"
  stories: 2
  coverage: 0.67
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "interview-prep.md" }
  tries: 3
fixture:
  expect: completed
  reached: [produce, verdict]
  inputs:
    application: "/stub/career/applications/acme"
    profile: "/stub/career/master_profile.md"
    stage: manager
exec-code: true
