name: interview-prep
description: |
  Bloc « interview-prep » : à partir d'une candidature (l'offre et son annonce, le profil
  maître, le CV et le pitch envoyés quand ils existent, des notes de recherche facultatives)
  et d'une étape d'entretien (rh, manager, technique ou final), écrit la préparation de cet
  entretien, en français, dans les artefacts du run (`interview-prep.md`) : questions
  probables pour l'étape, histoires STAR tirées du profil seul (chacune cite la ligne ou la
  section du profil d'où elle vient), note de cohérence avec ce que le CV et le pitch
  affirment déjà, questions à poser, script de simulation (questions seulement), points à
  clarifier. Un agent rédige, sans réseau ; un script vérifie ce que le code peut établir —
  sections, nombre d'histoires et leurs quatre parties, citations qui existent vraiment dans
  le profil, extraits du CV et du pitch cités mot pour mot, aucun chiffre sans source, pas
  de phrase creuse, mots-clés de l'offre — et renvoie l'agent au travail tant que ça ne passe
  pas ; puis un juge en contexte vierge note la pertinence pour l'annonce et l'étape,
  l'honnêteté et l'utilité, et n'approuve qu'à partir de A-. Rend un verdict typé (`ok`) ;
  si les contrôles sont encore rouges au troisième tour, le juge est sauté et le verdict dit
  `unconverged`. Rien ne sort du dépôt : le document reste dans les artefacts du run.

  Use when: une candidature décroche un entretien (ou va en décrocher un) et Antoine veut
  préparer une étape précise — « prépare l'entretien RH avec », « prépa entretien
  technique », « simulation d'entretien pour l'offre ».
  NOT for: écrire le CV ou le pitch (cv-tailor), postuler (apply-submit), chercher sur
  l'entreprise en ligne (le bloc n'a pas de réseau : lui passer des notes de recherche), ni
  mener la simulation en direct (le script liste les questions ; Antoine s'entraîne).

model: medium

# Pas de verrou de dossier : le bloc n'écrit que dans les artefacts du run (son agent le
# déclare aussi, `mutates_checkout: false`, et le moteur le vérifie dans un dépôt git). Lancé
# sur place (`--folder`, depuis le cockpit), il ne doit pas être annulé parce qu'un autre run
# (career-apply en attente d'un go, un écouteur) est actif dans le même dossier.
mutates_checkout: false

inputs:
  application:
    default: ""
    description: |
      Chemin absolu du dossier de candidature (`<career_dir>/applications/<slug>/`), facultatif.
      Y sont lus, s'ils existent : offer.json, annonce.md|txt, CV_*.md, Message_Accroche_*.md,
      interlocuteur_cible.json, remarques_utilisateur.txt ; sans offer.json, l'offre <slug> de
      <career_dir>/pending_gold_jobs.json (lu, jamais écrit). Les entrées explicites ci-dessous priment.
  offer:
    default: ""
    description: L'offre en JSON texte (company, title, link, skills_required, keywords, description, description_full). Vide = application/offer.json, puis l'offre du tableau, puis interlocuteur_cible.json.
  posting:
    default: ""
    description: Chemin absolu du texte de l'annonce (Markdown ou texte), facultatif. Vide = application/annonce.*, puis description_full de l'offre.
  profile:
    required: true
    description: Chemin absolu du profil maître (Markdown). Seule source des histoires STAR.
  cv:
    default: ""
    description: Chemin absolu du CV envoyé (Markdown), facultatif. Vide = application/CV_*.md.
  pitch:
    default: ""
    description: Chemin absolu du pitch envoyé (Markdown), facultatif. Vide = application/Message_Accroche_*.md.
  stage:
    default: rh
    description: Étape d'entretien à préparer — rh | manager | technique | final.
  research:
    default: ""
    description: Notes de recherche sur l'entreprise ou les interlocuteurs, en texte ou en chemin absolu, facultatives. Le bloc ne navigue pas ; ce qui n'est pas ici n'est pas connu.
  min_stories:
    default: "3"
    description: Nombre minimal d'histoires STAR.
  min_coverage:
    default: "0.5"
    description: Part des mots-clés de l'offre que le document doit citer, entre 0 et 1.
  out:
    default: interview-prep.md
    description: Nom du fichier de la préparation dans les artefacts du run.

returns: { node: verdict, outcome: ok }

nodes:
  # ── 1. Rédiger, puis contrôler par du code, en boucle ────────────────────
  # L'agent écrit la préparation ; le script `check` vérifie ; tant que le script dit non,
  # l'agent reçoit la liste des problèmes et recommence, 3 tours au plus. Au plafond, la
  # boucle rend la main avec des contrôles encore rouges (le compteur `tries` du script, pas
  # l'épuisement de max_iterations : une boucle épuisée finit `failed`, et Archon rejoue les
  # nœuds en échec quand un run reprend après une pause humaine). Le juge est alors sauté et
  # le verdict dit `unconverged`. Pas de réseau : l'agent ne lit que les pièces fournies.
  - id: produce
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ok=$check.output.ok; t=$check.output.tries; [ "$ok" = true ] || [ "$t" -ge 3 ]'
      nodes:
        - id: work
          command: work
          mutates_checkout: false                     # écrit dans $ARTIFACTS_DIR seulement
          allowed_tools: [Read, Glob, Grep, Write]   # lit les pièces, écrit dans les artefacts ; pas de réseau
          with:
            application: "$INPUTS.application"
            offer: "$INPUTS.offer"
            posting: "$INPUTS.posting"
            profile: "$INPUTS.profile"
            cv: "$INPUTS.cv"
            pitch: "$INPUTS.pitch"
            stage: "$INPUTS.stage"
            research: "$INPUTS.research"
            min_stories: "$INPUTS.min_stories"
            out: "$INPUTS.out"
            problems: "$LOOP_PREV.check.output.problems"
          output_format:
            type: object
            properties:
              summary: { type: string, pattern: '\S' }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
            required: [summary, deliverable]

        - id: check
          script: check
          runtime: bun
          depends_on: [work]
          with:
            application: "$INPUTS.application"
            offer: "$INPUTS.offer"
            posting: "$INPUTS.posting"
            profile: "$INPUTS.profile"
            cv: "$INPUTS.cv"
            pitch: "$INPUTS.pitch"
            stage: "$INPUTS.stage"
            research: "$INPUTS.research"
            min_stories: "$INPUTS.min_stories"
            min_coverage: "$INPUTS.min_coverage"
            out: "$INPUTS.out"
            summary: "$work.output.summary"
            deliverable: { from: "$work.output.deliverable" }
            tries: "$LOOP_PREV.check.output.tries"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              summary: { type: string }
              stories: { type: integer, minimum: 0 }
              coverage: { type: number }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
              tries: { type: integer, minimum: 1 }
            required: [ok, problems, summary, stories, coverage, deliverable, tries]

  # ── 2. Le juge : ce que le code ne peut pas trancher ─────────────────────
  # Contexte vierge, lecture seule, modèle plus fort. Il ne tourne que si les contrôles sont
  # verts : pertinence pour l'annonce et l'étape, honnêteté, utilité.
  - id: judge
    command: judge
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Glob, Grep]   # lecture seule : la préparation et les pièces de la candidature
    model: large
    depends_on: [produce]
    when: "$produce.output.ok == true"
    with:
      application: "$INPUTS.application"
      offer: "$INPUTS.offer"
      posting: "$INPUTS.posting"
      profile: "$INPUTS.profile"
      cv: "$INPUTS.cv"
      pitch: "$INPUTS.pitch"
      stage: "$INPUTS.stage"
      research: "$INPUTS.research"
      out: "$INPUTS.out"
      produced: "$produce.output"
    output_format:
      type: object
      properties:
        approved: { type: boolean }
        grade: { type: string, pattern: '^[A-F][+-]?$' }
        reason: { type: string, pattern: '\S' }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string, pattern: '\S' }
            required: [severity, text]
      required: [approved, grade, reason, findings]

  # ── 3. Verdict ───────────────────────────────────────────────────────────
  # Un script dérive l'issue des deux faits certifiés : contrôles verts et juge favorable.
  # Il tourne aussi quand le juge est sauté (contrôles rouges au plafond) : `unconverged`. Il
  # ne tourne pas si le juge a échoué (erreur du modèle) : une liaison ne lit jamais un nœud
  # en échec, et le verdict sauté se lit `null` chez l'appelant (`if_skipped: null`).
  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [produce, judge]
    trigger_rule: none_failed_min_one_success
    with:
      produced: "$produce.output"
      approved: { from: "$judge.output.approved", if_skipped: null }
      grade: { from: "$judge.output.grade", if_skipped: null }
      reason: { from: "$judge.output.reason", if_skipped: null }
      findings: { from: "$judge.output.findings", if_skipped: null }
    output_type: block-verdict
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [verified, rejected, unconverged] }
        summary: { type: string }
        problems: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string }
            required: [severity, text]
        deliverable:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, pattern: '\S' }
          required: [type, run_id, path]
      required: [ok, status, summary, problems, findings, deliverable]
