name: job-triage
description: |
  Bloc « job-triage » : trie une offre captée par le radar contre les critères du candidat
  (`criteres.json` : langues parlées, salaire annuel minimum, salaire inconnu, mode de travail,
  expérience maximale exigible et intitulés senior exclus, critères libres) et, quand il est
  donné, contre le profil du candidat (`master_profile.md`). Un agent moyen (Sonnet, palier
  `medium`) lit l'annonce complète et en extrait, avec une citation mot pour mot pour chaque fait, les
  langues demandées (exigées ou souhaitées), le salaire (montant, devise, période), le mode de
  travail (télétravail complet, hybride, sur site, non précisé), l'expérience exigée (années,
  label de séniorité), les critères libres et les trois exigences centrales du poste, chacune
  étayée, en partie ou pas du tout par le profil (citation du profil) ; un script vérifie chaque
  citation contre le texte de l'annonce ou du profil, balaie le texte pour rattraper une langue,
  un montant, une mention « hybrid » / « sur site » / des mois au bureau pendant l'intégration
  ou un « N ans d'expérience » oubliés, puis décide seul
  (`decideTriage`) : écartée (annonce rédigée ou langue exigée hors des langues parlées,
  salaire annuel maximal sous le seuil, poste hybride ou sur site quand `remote` vaut `full`,
  le défaut, années d'expérience exigées au-delà d'`experience_max_annees`, intitulé senior,
  offre publiée il y a plus de `offre_age_max_jours` jours, 7 par défaut, date du tableau,
  deux exigences centrales ou plus absentes du profil),
  à vérifier (salaire absent, mode de travail non précisé sauf offre d'une plateforme 100 %
  télétravail sans marqueur hybride ou sur site, « profil senior » dans le corps, annonce lue
  en partie, critère libre non rempli) ou retenue. Un juge en contexte vierge (Sonnet, palier
  `medium`) relit l'annonce, le profil et l'extraction : une exigence manquée, une langue
  « souhaitée » lue comme exigée, un salaire mensuel lu comme annuel, un poste de bureau lu comme
  télétravail, sept ans d'expérience lus comme deux, une exigence secondaire prise pour le cœur
  du poste, un appui du profil inventé ou ignoré le font refuser ; il ne décide pas l'issue.
  Rend un verdict typé (`ok`) avec la décision et ses raisons ; contrôles encore rouges au
  deuxième tour : `unconverged`, le juge est sauté. Coût : 2 appels de modèle (un tour + juge),
  3 au plus.

  Use when: an offer the radar captured must be screened before the candidate looks at it —
  "trie les offres", "écarte celles qui demandent l'italien", "salaire sous 35k".
  NOT for: scoring the fit of the candidate (the jury upstream) or writing the application (cv-tailor).

# Économe (2026-10-24) : l'extraction est cadrée par le code (citations, balayage) ; le palier
# Sonnet : Haiku recollait des citations du profil (essai réel sur Alan, 2026-10-24). Aucun appel Opus.
model: medium

inputs:
  offer:
    required: true
    description: The offer as JSON text (company, title, link, slug, location, source — a remote-only board counts as remote when the posting says nothing of the work place; date_published and radar_at — the age rule, no effect when absent or unreadable).
  criteria:
    required: true
    description: The candidate's criteres.json as JSON text (langues, salaire_min_annuel, salaire_inconnu, taux_eur, remote, experience_max_annees, experience_labels_exclus, offre_age_max_jours, exclure).
  posting:
    default: posting.txt
    description: File name, inside the run's artifacts, of the posting text the caller fetched (plus the radar's own fields).
  posting_full:
    default: "true"
    description: '"false" when the caller could not read the full posting (only the radar summary is in the file): the offer can then be rejected on what was read, never retained.'
  profile:
    default: ""
    description: File name, inside the run's artifacts, of the candidate's master profile (master_profile.md as text); empty means no profile, the core-of-role fit is then not assessed (a note says so).
  out:
    default: triage.json
    description: File name of the extraction inside the run's artifacts.

returns: { node: verdict, outcome: ok }

nodes:
  # ── 1. Extraire, puis contrôler par du code, en boucle ───────────────────
  # L'agent cite ; le script `check` vérifie les citations, balaie l'annonce et décide ; tant
  # qu'il dit non, l'agent reçoit la liste des problèmes et recommence, 2 tours au plus. Au
  # plafond, la boucle rend la main (compteur `tries`), le juge est sauté et le verdict dit
  # `unconverged`.
  - id: produce
    loop_group:
      max_iterations: 2
      fresh_context: true
      until_bash: 'ok=$check.output.ok; t=$check.output.tries; [ "$ok" = true ] || [ "$t" -ge 2 ]'
      nodes:
        - id: work
          command: work
          allowed_tools: [Read, Write]   # lit l'annonce et le profil, écrit l'extraction dans les artefacts
          model: medium
          with:
            offer: "$INPUTS.offer"
            criteria: "$INPUTS.criteria"
            posting: "$INPUTS.posting"
            profile: "$INPUTS.profile"
            out: "$INPUTS.out"
            problems: "$LOOP_PREV.check.output.problems"
          output_format:
            type: object
            properties:
              summary: { type: string, pattern: '\S' }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
            required: [summary, deliverable]

        - id: check
          script: check
          runtime: bun
          depends_on: [work]
          with:
            criteria: "$INPUTS.criteria"
            offer: "$INPUTS.offer"   # son `title` : la règle des intitulés senior ; `date_published` : la règle d'âge
            posting: "$INPUTS.posting"
            posting_full: "$INPUTS.posting_full"
            profile: "$INPUTS.profile"   # vide : cœur du poste non évalué
            out: "$INPUTS.out"
            summary: "$work.output.summary"
            deliverable: { from: "$work.output.deliverable" }
            tries: "$LOOP_PREV.check.output.tries"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              summary: { type: string }
              decision: { type: string }
              reasons: { type: array, items: { type: string } }
              notes: { type: array, items: { type: string } }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
              tries: { type: integer, minimum: 1 }
            required: [ok, problems, summary, decision, reasons, notes, deliverable, tries]

  # ── 2. Juger ce que le code ne peut pas trancher ─────────────────────────
  # Contexte vierge, lecture seule : il relit l'annonce et l'extraction, pas le travail.
  - id: judge
    command: judge
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Glob, Grep]   # lecture seule : l'annonce, le profil, l'extraction, la décision
    model: medium   # Sonnet : vérifie la fidélité de l'extraction, ne décide pas l'issue
    depends_on: [produce]
    when: "$produce.output.ok == true"
    with:
      criteria: "$INPUTS.criteria"
      posting: "$INPUTS.posting"
      profile: "$INPUTS.profile"
      out: "$INPUTS.out"
      produced: "$produce.output"
    output_format:
      type: object
      properties:
        approved: { type: boolean }
        reason: { type: string, pattern: '\S' }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string, pattern: '\S' }
            required: [severity, text]
      required: [approved, reason, findings]

  # ── 3. Verdict ───────────────────────────────────────────────────────────
  # La décision n'est rendue que si le bloc est vérifié ; sinon `decision` est vide et
  # l'appelant classe l'offre « à vérifier » (jamais écartée sans preuve vérifiée).
  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [produce, judge]
    trigger_rule: none_failed_min_one_success
    with:
      produced: "$produce.output"
      approved: { from: "$judge.output.approved", if_skipped: null }
      reason: { from: "$judge.output.reason", if_skipped: null }
      findings: { from: "$judge.output.findings", if_skipped: null }
    output_type: block-verdict
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [verified, rejected, unconverged] }
        summary: { type: string }
        decision: { type: string }
        reasons: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
        problems: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string }
            required: [severity, text]
        deliverable:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, pattern: '\S' }
          required: [type, run_id, path]
      required: [ok, status, summary, decision, reasons, notes, problems, findings, deliverable]
