# Issue « rejected » : les contrôles passent mais le juge refuse. Le run se termine
# normalement avec une issue autorisée négative (ok: false) : statut et issue sont deux faits.
# attendu: ok=false status=rejected
work:
  summary: "stub: the deliverable is complete"
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "index.html" }
check:
  ok: true
  problems: []
  summary: "stub: the deliverable is complete"
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "index.html" }
  tries: 1
judge:
  approved: false
  reason: "stub: the hero promises a result the brief never states"
  findings:
    - { severity: blocking, text: "stub: the proof block shows a 3x figure absent from the brief" }
fixture:
  expect: completed
  reached: [judge, verdict]
  inputs:
    brief: "stub brief"
exec-code: true
