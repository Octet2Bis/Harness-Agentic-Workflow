name: landing-page
description: |
  Bloc « landing-page » : produit la page de conversion du pôle 03 Expérimentation & CRO de
  Master Plan — un seul fichier HTML autonome, une promesse = l'intention, un CTA primaire,
  le DataLayer et l'événement `click_cta` posés avant la mise en ligne, les tokens CSS et la
  règle anti-slop visuel respectés. Un agent écrit la page ; un script vérifie ce que la
  règle du pôle et `tracking_validator.py` exigeaient (DataLayer, `click_cta`, CTA unique,
  méta, H1, tokens, pas de flou décoratif, pas de script externe hors GTM, taille) ; un juge
  en contexte vierge applique la grille CRO (clarté, friction, anxiété, motivation) et la
  checklist visuelle. Rend un verdict typé.

  Use when: an intent cluster needs its page — "la landing pour", "page de capture",
  "wireframe HTML de".
  NOT for: the tracking plan itself (write it first; the page implements it) or
  publishing (the caller stores it under Workspace/campaigns/<campagne>/landing_pages/).

model: medium

inputs:
  brief:
    required: true
    description: Offer, promise, audience, proof elements and the single action wanted, in the requester's words.
  intent:
    default: ""
    description: The search intent / ad promise the page must honour word for word.
  tracking_plan:
    default: ""
    description: Optional path or text of the tracking plan (events and properties to push). click_cta is always required.
  template:
    default: ""
    description: Optional path of the reference template (01_GTM_Growth/03_Experimentation/templates/landing_page_template.html) to start from.
  out:
    default: index.html
    description: File name of the deliverable inside the run's artifacts.

returns: { node: verdict, outcome: ok }

nodes:
  - id: produce
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ok=$check.output.ok; t=$check.output.tries; [ "$ok" = true ] || [ "$t" -ge 3 ]'
      nodes:
        - id: work
          command: work
          allowed_tools: [Read, Glob, Grep, Write]
          with:
            brief: "$INPUTS.brief"
            intent: "$INPUTS.intent"
            tracking_plan: "$INPUTS.tracking_plan"
            template: "$INPUTS.template"
            out: "$INPUTS.out"
            problems: "$LOOP_PREV.check.output.problems"
          output_format:
            type: object
            properties:
              summary: { type: string, pattern: '\S' }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
            required: [summary, deliverable]

        - id: check
          script: check
          runtime: bun
          depends_on: [work]
          with:
            out: "$INPUTS.out"
            summary: "$work.output.summary"
            deliverable: { from: "$work.output.deliverable" }
            tries: "$LOOP_PREV.check.output.tries"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              summary: { type: string }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
              tries: { type: integer, minimum: 1 }
            required: [ok, problems, summary, deliverable, tries]

  - id: judge
    command: judge
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Glob, Grep]   # lecture seule : le juge ne voit que la page, le brief, le plan de tracking
    model: large
    depends_on: [produce]
    when: "$produce.output.ok == true"
    with:
      brief: "$INPUTS.brief"
      intent: "$INPUTS.intent"
      tracking_plan: "$INPUTS.tracking_plan"
      out: "$INPUTS.out"
      produced: "$produce.output"
    output_format:
      type: object
      properties:
        approved: { type: boolean }
        reason: { type: string, pattern: '\S' }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string, pattern: '\S' }
            required: [severity, text]
      required: [approved, reason, findings]

  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [produce, judge]
    trigger_rule: none_failed_min_one_success
    with:
      produced: "$produce.output"
      approved: { from: "$judge.output.approved", if_skipped: null }
      reason: { from: "$judge.output.reason", if_skipped: null }
      findings: { from: "$judge.output.findings", if_skipped: null }
    output_type: block-verdict
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [verified, rejected, unconverged] }
        summary: { type: string }
        problems: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string }
            required: [severity, text]
        deliverable:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, pattern: '\S' }
          required: [type, run_id, path]
      required: [ok, status, summary, problems, findings, deliverable]
