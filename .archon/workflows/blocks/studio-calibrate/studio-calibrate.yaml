name: studio-calibrate
description: |
  Bloc « studio-calibrate » : la porte d'entrée du Studio (UC-14). Lit une demande de projet
  de design ou de dev et la calibre : projet purement graphique, site, ou app. Écrit
  `calibrage.json` (type, citations de la demande qui le décident, livrables, plateformes,
  fichiers déjà faits, route). Le code vérifie que le type est l'un des trois, que chaque
  citation est mot pour mot dans la demande, que les plateformes vont avec le type, que les
  fichiers cités existent et que la route est celle que le type impose ; un juge en contexte
  vierge vérifie que le type est le bon. Rend un verdict typé.

  Use when: a design or dev project starts and its kind is not settled yet — "je veux
  refaire Aevum", "il me faut un site pour", "une identité visuelle pour".
  NOT for: one page from an existing design system (landing-page) or a code change in a
  repository (feature-build).

model: medium

inputs:
  request:
    required: true
    description: "The project request, in the requester's words."
  context:
    default: ""
    description: "Optional material: notes, links, absolute paths to existing files the work can read."
  project_dir:
    default: ""
    description: "Optional absolute path to the existing project folder; files listed under `existing` must be found there."
  out:
    default: calibrage.json
    description: "File name of the calibration inside the run's artifacts."

returns: { node: verdict, outcome: ok }

nodes:
  # ── 1. Produire, puis contrôler par du code, en boucle (3 tours au plus) ──
  - id: produce
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ok=$check.output.ok; t=$check.output.tries; [ "$ok" = true ] || [ "$t" -ge 3 ]'
      nodes:
        - id: work
          command: work
          allowed_tools: [Read, Glob, Grep, Write]
          with:
            request: "$INPUTS.request"
            context: "$INPUTS.context"
            project_dir: "$INPUTS.project_dir"
            out: "$INPUTS.out"
            problems: "$LOOP_PREV.check.output.problems"
          output_format:
            type: object
            properties:
              summary: { type: string, pattern: '\S' }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
            required: [summary, deliverable]

        - id: check
          script: check
          runtime: bun
          depends_on: [work]
          with:
            request: "$INPUTS.request"
            context: "$INPUTS.context"
            project_dir: "$INPUTS.project_dir"
            out: "$INPUTS.out"
            summary: "$work.output.summary"
            deliverable: { from: "$work.output.deliverable" }
            tries: "$LOOP_PREV.check.output.tries"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              summary: { type: string }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
              tries: { type: integer, minimum: 1 }
            required: [ok, problems, summary, deliverable, tries]

  # ── 2. Ce que le code ne tranche pas : un juge en contexte vierge, en lecture seule ──
  - id: judge
    command: judge
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Glob, Grep]
    model: large
    depends_on: [produce]
    when: "$produce.output.ok == true"
    with:
      request: "$INPUTS.request"
      context: "$INPUTS.context"
      project_dir: "$INPUTS.project_dir"
      out: "$INPUTS.out"
      produced: "$produce.output"
    output_format:
      type: object
      properties:
        approved: { type: boolean }
        reason: { type: string, pattern: '\S' }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string, pattern: '\S' }
            required: [severity, text]
      required: [approved, reason, findings]

  # ── 3. Issue typée : verified, rejected ou unconverged ──
  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [produce, judge]
    trigger_rule: none_failed_min_one_success
    with:
      produced: "$produce.output"
      approved: { from: "$judge.output.approved", if_skipped: null }
      reason: { from: "$judge.output.reason", if_skipped: null }
      findings: { from: "$judge.output.findings", if_skipped: null }
    output_type: block-verdict
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [verified, rejected, unconverged] }
        summary: { type: string }
        problems: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string }
            required: [severity, text]
        deliverable:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, pattern: '\S' }
          required: [type, run_id, path]
      required: [ok, status, summary, problems, findings, deliverable]
