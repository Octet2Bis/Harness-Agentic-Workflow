# Issue « unconverged » : au troisième et dernier tour permis, les contrôles disent encore non
# (lettre trop longue, un chiffre absent du profil, une seule preuve tracée). La boucle rend
# la main (compteur `tries` au plafond, pas d'épuisement de max_iterations), le Reviewer est
# sauté (`when: $produce.output.ok == true` ; aucun stub `judge` ici : un nœud atteint sans
# stub ferait échouer le dry-run) et le verdict (script réel) rend quand même une issue
# typée : ok: false, status: unconverged, sans constats, avec les derniers problèmes. Le
# dry-run ne joue qu'un tour de boucle : le stub `check_letter` porte directement l'état du
# dernier tour.
# attendu: ok=false status=unconverged findings=[] deliverable={"type":"archon_artifact","run_id":"fixture-run","path":"application/letter.md"}
write_letter:
  summary: "stub: angle croissance, le profil ne porte qu'une réalisation chiffrée"
  language: fr
  evidence:
    - { letter: "j'ai conduit des campagnes outbound à ~50% de taux d'ouverture", profile: "campagnes outbound à ~50% de taux d'ouverture" }
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "application/letter.md" }
check_letter:
  ok: false
  problems:
    - "lettre trop longue : 342 mots de corps, au plus 300 (de la formule d'appel à la formule de politesse) : couper ce qui répète le CV"
    - "chiffre « 40% » absent du profil maître et de l'annonce : affirmation sans source"
    - "1 preuve(s) tracée(s) vers le profil, au moins 2 attendues : déclarer dans « evidence » chaque réalisation citée (passage de la lettre + passage du profil, mot pour mot)"
  summary: "stub: angle croissance, le profil ne porte qu'une réalisation chiffrée"
  language: fr
  words: 342
  lines: 47
  traced: 1
  evidence:
    - { letter: "j'ai conduit des campagnes outbound à ~50% de taux d'ouverture", profile: "campagnes outbound à ~50% de taux d'ouverture" }
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "application/letter.md" }
  tries: 3
fixture:
  expect: completed
  reached: [produce, verdict]
  inputs:
    offer: '{"company":"Acme","title":"Growth Ops Manager (H/F)","link":"https://jobs.lever.co/acme/123","slug":"acme","skills_required":"n8n, CRM, outbound"}'
    profile: "/stub/master_profile.md"
exec-code: true
