name: studio-brief
description: |
  Bloc « studio-brief » : la porte 0 d'un projet du Studio. Écrit `BRIEF.md` (Problème,
  Cible, Contexte d'usage, Hors-champ, Appétit, Plateforme, Critères de réussite) à partir de
  la demande et du cadrage. Le code vérifie les sections, la longueur (lu en deux minutes),
  au moins trois choses que le projet ne fera pas, au moins deux critères vérifiables, et une
  plateforme compatible avec le type calibré ; un juge en contexte vierge vérifie que le
  problème est celui du demandeur et que rien n'est inventé. Rend un verdict typé.

  Use when: a calibrated project needs its brief before any design — "écris le brief",
  "cadre le projet".
  NOT for: calibrating the project kind (studio-calibrate) or a product requirements
  document with screens and states (the app lane's PRD).

model: medium

inputs:
  request:
    required: true
    description: "The project request, in the requester's words."
  context:
    default: ""
    description: "Optional material: notes, links, absolute paths to existing files the work can read."
  type:
    default: ""
    description: "graphique, site or app; empty reads `calibrage.json` in the run artifacts (written by studio-calibrate)."
  out:
    default: BRIEF.md
    description: "File name of the brief inside the run's artifacts."

returns: { node: verdict, outcome: ok }

nodes:
  # ── 1. Produire, puis contrôler par du code, en boucle (3 tours au plus) ──
  - id: produce
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ok=$check.output.ok; t=$check.output.tries; [ "$ok" = true ] || [ "$t" -ge 3 ]'
      nodes:
        - id: work
          command: work
          allowed_tools: [Read, Glob, Grep, Write]
          with:
            request: "$INPUTS.request"
            context: "$INPUTS.context"
            type: "$INPUTS.type"
            out: "$INPUTS.out"
            problems: "$LOOP_PREV.check.output.problems"
          output_format:
            type: object
            properties:
              summary: { type: string, pattern: '\S' }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
            required: [summary, deliverable]

        - id: check
          script: check
          runtime: bun
          depends_on: [work]
          with:
            type: "$INPUTS.type"
            out: "$INPUTS.out"
            summary: "$work.output.summary"
            deliverable: { from: "$work.output.deliverable" }
            tries: "$LOOP_PREV.check.output.tries"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              summary: { type: string }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
              tries: { type: integer, minimum: 1 }
            required: [ok, problems, summary, deliverable, tries]

  # ── 2. Ce que le code ne tranche pas : un juge en contexte vierge, en lecture seule ──
  - id: judge
    command: judge
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Glob, Grep]
    model: large
    depends_on: [produce]
    when: "$produce.output.ok == true"
    with:
      request: "$INPUTS.request"
      context: "$INPUTS.context"
      type: "$INPUTS.type"
      out: "$INPUTS.out"
      produced: "$produce.output"
    output_format:
      type: object
      properties:
        approved: { type: boolean }
        reason: { type: string, pattern: '\S' }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string, pattern: '\S' }
            required: [severity, text]
      required: [approved, reason, findings]

  # ── 3. Issue typée : verified, rejected ou unconverged ──
  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [produce, judge]
    trigger_rule: none_failed_min_one_success
    with:
      produced: "$produce.output"
      approved: { from: "$judge.output.approved", if_skipped: null }
      reason: { from: "$judge.output.reason", if_skipped: null }
      findings: { from: "$judge.output.findings", if_skipped: null }
    output_type: block-verdict
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [verified, rejected, unconverged] }
        summary: { type: string }
        problems: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string }
            required: [severity, text]
        deliverable:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, pattern: '\S' }
          required: [type, run_id, path]
      required: [ok, status, summary, problems, findings, deliverable]
