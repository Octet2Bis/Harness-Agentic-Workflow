# Issue « unconverged » : au dernier tour permis, les contrôles disent encore non. La boucle
# rend la main (compteur `tries` au plafond, pas d'épuisement de max_iterations), le juge est
# sauté (`when: $produce.output.ok == true`) et le verdict (script réel) rend quand même une
# issue typée avec les derniers problèmes. Le dry-run ne joue qu'un tour de boucle : le stub
# `check` porte directement l'état du dernier tour.
# attendu: ok=false status=unconverged
work:
  summary: "stub: the deliverable answers the task; nothing left open"
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "asset.md" }
check:
  ok: false
  problems: ["stub: the check still fails on the last allowed round"]
  summary: "stub: the deliverable answers the task; nothing left open"
  deliverable: { type: archon_artifact, run_id: "fixture-run", path: "asset.md" }
  tries: 3
fixture:
  expect: completed
  reached: [produce, verdict]
  inputs:
    brief: "stub brief"
exec-code: true
