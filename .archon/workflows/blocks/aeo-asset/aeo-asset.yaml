name: aeo-asset
description: |
  Bloc « aeo-asset » : écrit un actif de contenu du pôle 02 Acquisition & AEO de Master Plan
  — un article ou une page qui répond à une intention de recherche et que les moteurs de
  réponse (Perplexity, ChatGPT, Claude) peuvent citer : réponse directe en tête, sections
  H2 nettes, FAQ, et son bloc JSON-LD Schema.org (type principal + FAQPage). Un agent
  rédige ; un script applique ce que `schema_validator.py` et la règle du pôle exigeaient
  (JSON-LD valide, @context schema.org, champs obligatoires par @type, FAQPage ≥ 3 Q/R,
  hiérarchie des titres, intention restituée, pas de phrase creuse) ; un juge en contexte
  vierge vérifie que la page répond à l'intention, sans affirmation hors positionnement.

  Use when: a page or article must be produced for an intent cluster — "écris la page sur",
  "l'article pour l'intention", "la FAQ de".
  NOT for: choosing the intents (intent_graph, block design) or publishing (the caller
  stores it under Workspace/campaigns/<campagne>/acquisition/ after human review).

model: medium

inputs:
  brief:
    required: true
    description: Topic, audience, product or offer, and the angle, in the requester's words.
  intent:
    default: ""
    description: The search intent (query) the asset must answer, as the ICP would type it.
  positioning:
    default: ""
    description: Optional path or text of the positioning (01_Strategy_and_Positioning/output/positioning.md). Nothing outside it may be claimed about the product.
  type:
    default: Article
    description: Main Schema.org type (Article, BlogPosting, HowTo, SoftwareApplication, Product, WebPage). A FAQPage block is always added.
  out:
    default: asset.md
    description: File name of the deliverable inside the run's artifacts.

returns: { node: verdict, outcome: ok }

nodes:
  - id: produce
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ok=$check.output.ok; t=$check.output.tries; [ "$ok" = true ] || [ "$t" -ge 3 ]'
      nodes:
        - id: work
          command: work
          allowed_tools: [Read, Glob, Grep, Write, WebSearch, WebFetch]
          with:
            brief: "$INPUTS.brief"
            intent: "$INPUTS.intent"
            positioning: "$INPUTS.positioning"
            type: "$INPUTS.type"
            out: "$INPUTS.out"
            problems: "$LOOP_PREV.check.output.problems"
          output_format:
            type: object
            properties:
              summary: { type: string, pattern: '\S' }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
            required: [summary, deliverable]

        - id: check
          script: check
          runtime: bun
          depends_on: [work]
          with:
            intent: "$INPUTS.intent"
            out: "$INPUTS.out"
            summary: "$work.output.summary"
            deliverable: { from: "$work.output.deliverable" }
            tries: "$LOOP_PREV.check.output.tries"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              summary: { type: string }
              deliverable:
                type: object
                properties:
                  type: { type: string, enum: [archon_artifact] }
                  run_id: { type: string }
                  path: { type: string, pattern: '\S' }
                required: [type, run_id, path]
              tries: { type: integer, minimum: 1 }
            required: [ok, problems, summary, deliverable, tries]

  - id: judge
    command: judge
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Glob, Grep]   # lecture seule : le juge ne voit que l'actif, le brief, le positionnement
    model: large
    depends_on: [produce]
    when: "$produce.output.ok == true"
    with:
      brief: "$INPUTS.brief"
      intent: "$INPUTS.intent"
      positioning: "$INPUTS.positioning"
      out: "$INPUTS.out"
      produced: "$produce.output"
    output_format:
      type: object
      properties:
        approved: { type: boolean }
        reason: { type: string, pattern: '\S' }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string, pattern: '\S' }
            required: [severity, text]
      required: [approved, reason, findings]

  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [produce, judge]
    trigger_rule: none_failed_min_one_success
    with:
      produced: "$produce.output"
      approved: { from: "$judge.output.approved", if_skipped: null }
      reason: { from: "$judge.output.reason", if_skipped: null }
      findings: { from: "$judge.output.findings", if_skipped: null }
    output_type: block-verdict
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [verified, rejected, unconverged] }
        summary: { type: string }
        problems: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocking, minor] }
              text: { type: string }
            required: [severity, text]
        deliverable:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, pattern: '\S' }
          required: [type, run_id, path]
      required: [ok, status, summary, problems, findings, deliverable]
