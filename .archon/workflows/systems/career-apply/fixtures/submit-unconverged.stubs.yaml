# Issue « submit-unconverged » : le dossier est vérifié et rendu, la page de candidature est
# confirmée, mais au deuxième et dernier tour permis le formulaire ne passe toujours pas ses
# contrôles (un CAPTCHA arrête l'agent). La boucle `prepare` d'apply-submit rend la main au
# plafond (compteur `tries`) et rien ne part : `submit__gate` est sauté, `submit__decide`
# (réel) dit `unconverged`, `submit__verdict` (réel) rend ok: false, status: unconverged,
# submitted: false.
# Preuve de sûreté : plateforme non vérifiée en mode verified-only (le cran demanderait un
# go), et aucun stub pour `submit__go` (approbation), `submit__submit` ni `submit__judge`
# (agents) : atteindre `submit__go` mettrait le run en pause, atteindre un agent ferait
# échouer le dry-run (« Missing reachable stub ») ; la fixture, qui attend `completed`,
# prouve que personne n'est sollicité et que rien n'est cliqué (`submit__check_receipt` ne
# tourne qu'après `submit__submit`).
# `record` s'exécute pour de vrai (le dossier carrière /stub/career n'existe pas : il n'écrit
# rien) et clôt l'offre en TAILORED, stage submit : dossier prêt, envoi non fait, jamais
# APPLIED ni APPLY_UNPROVEN sans `submitted: true`.
# Le dry-run ne joue qu'un tour de boucle : le stub `check_prefill` porte l'état du dernier tour.
# attendu(submit__decide): proceed=false path=unconverged
# attendu(submit__verdict): ok=false status=unconverged submitted=false findings=[]
# attendu: ok=false stage=submit status=TAILORED status_written=false copied=[]
