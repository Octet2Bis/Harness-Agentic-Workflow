# Issue « submit-superseded » : scénario A du round 3. Antoine lance career-apply à la main
# pendant que le listener tient l'offre, ou un vieux run est repris après que le filet a clos
# sa prise et qu'un /valider l'a remise en file. Le go est donné ; juste avant `arm`, la garde
# `submit__own` (`always_run`) relit pending_gold_jobs.json et l'offre n'est plus tenue par la
# prise de ce run. Le dry-run ne lit pas de vrai tableau : le stub porte ce qu'elle a lu (sa
# règle, `ownership`, est testée dans blocks/apply-submit/scripts/own.test.ts ; `load`, qui
# refuse d'emblée une offre tenue par un autre run, dans scripts/load.test.ts).
# `submit__verdict` (réel) rend superseded, submitted: false ; `record` (réel) en dérive
# TAILORED, stage submit, et n'écrit rien (dossier carrière absent ; sur un vrai tableau,
# `mayRecord` refuse aussi : l'offre n'est plus à cette prise).
# Preuve de sûreté : aucun stub pour `submit__submit`, `submit__check_receipt` ni
# `submit__judge` ; `submit__arm` (réel) n'est pas atteint. La fixture, qui attend
# `completed`, prouve qu'aucun clic n'a lieu sur une offre qui n'est plus tenue.
# attendu(submit__decide): proceed=true path=approved
# attendu(submit__verdict): ok=false status=superseded submitted=false
# attendu: ok=false stage=submit status=TAILORED status_written=false copied=[]
