# Issue « submit-crashed-after-go » : le défaut du double clic, première moitié. Le go est
# donné (plateforme vérifiée : automatique), `submit__arm` (réel) écrit armed.json et ouvre la
# porte, puis l'agent `submit__submit` tombe en erreur (erreur du modèle, ou sortie hors
# output_format), peut-être APRÈS avoir cliqué. `submit__submit` n'a pas de stub : le dry-run
# le fait échouer comme une erreur du modèle. `check_receipt`, le juge et le verdict du bloc
# sont sautés (amont en échec) ; `record` (réel, all_done) lit le verdict null et cherche les
# traces d'un clic dans submission/ : decision.json (`proceed: true`) et armed.json (submit a
# démarré), écrits pour de vrai par `submit__decide` et `submit__arm`. Il rend donc
# APPLY_UNPROVEN (vérifier la boîte mail), jamais TAILORED (« prêt, pas envoyé »).
# Seconde moitié, hors de portée du dry-run (il ne sait pas reprendre un run) : le listener qui
# reprend relance cet enfant en échec, Archon rejoue `submit__arm` (always_run), qui trouve
# armed.json et ferme la porte : `submit` n'est pas rejoué (fixture apply-submit
# `resumed-after-click`, règle `armSubmit` testée dans apply-submit/scripts/click-trace.test.ts).
# click.json, que l'agent écrit juste avant de cliquer, compte aussi (`clickEvidence`,
# systems/.shared/career.test.ts). Le run finit `failed` ; `record` tourne sur un dossier
# carrière qui n'existe pas (/stub/career) : il n'écrit rien.
