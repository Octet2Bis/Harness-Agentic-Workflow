  ok: true
  summary: "stub: offer Acme — Growth Ops Manager loaded"
  slug: acme
  profile: "/stub/career/master_profile.md"
  proofs: "/stub/career/skill_proof_graph.json"
  remarks: ""
  keywords: "n8n, GTM, HubSpot"
  offer_json: "{\"company\":\"Acme\",\"title\":\"Growth Ops Manager\",\"link\":\"https://fr.linkedin.com/jobs/view/growth-ops-at-acme-123\",\"slug\":\"acme\"}"
  link: "https://fr.linkedin.com/jobs/view/growth-ops-at-acme-123"
  board: "/stub/career/pending_gold_jobs.json"
  claim_run: "manual-run-1"
  self_claimed: true
  answers: ""
work:
