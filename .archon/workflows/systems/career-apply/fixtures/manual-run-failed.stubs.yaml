# Issue « manual-run-failed » : Antoine lance career-apply à la main (premier run réel,
# `mode=confirm`). `load` a pris l'offre pour ce run (stub : `self_claimed: true`, `claim_run` =
# ce run ; la prise elle-même est testée dans scripts/load.test.ts). Le lien est un agrégateur
# et l'agent `resolve` tombe en erreur (pas de stub) : `confirm_route` échoue sur sa liaison,
# `record` aussi (Archon ne lit jamais un nœud en échec), le run finit `failed`. Sans listener,
# l'offre resterait APPLYING par ce run, et le listener ne prendrait rien pendant deux heures
# (une candidature en vol à la fois). `settle` (réel, `all_done`, seulement pour une prise de ce
# run) tourne quand même : il clôt l'offre si elle est encore APPLYING par ce run (record.json,
# sinon APPLY_UNPROVEN s'il y a trace d'un clic, sinon APPLY_FAILED). Ici le dossier carrière
# /stub/career n'existe pas : il n'écrit rien (settled: false) ; sa décision (`settleClaim`)
# est testée dans .shared/pending.test.ts et scripts/load.test.ts.
# Preuve de sûreté : aucun stub pour `prefill`, `submit__go`, `submit__submit` : apply-submit
# n'est pas atteint.
# attendu(route): aggregator=true needs_resolve=true
# attendu(settle): settled=false slug="acme"
