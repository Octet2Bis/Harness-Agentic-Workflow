# Issue « submit-no-verdict » : le go est automatique (plateforme vérifiée), le clic a eu
# lieu, mais le juge d'apply-submit tombe en erreur. `submit__judge` n'a pas de stub : le
# dry-run le fait échouer comme une erreur du modèle. Le verdict du bloc est alors sauté
# (none_failed_min_one_success) et `record` (réel, all_done) le lit null (`if_skipped: null`).
# Il cherche les traces d'un clic dans submission/ : en dry-run, `submit__decide` (réel) y a
# écrit decision.json (`proceed: true`, clic autorisé) et `submit__arm` (réel) armed.json
# (submit a démarré) ; les agents et contrôles stubbés n'écrivent rien. `record` écrit donc APPLY_UNPROVEN (vérifier la boîte mail), jamais
# TAILORED (« prêt, pas envoyé ») : l'humain ne postule pas une seconde fois. La décision
# elle-même (`clickEvidence`, avec ou sans traces) est testée dans systems/.shared/career.test.ts.
# Le run finit `failed` (le juge a échoué) ; `record` tourne sur un dossier carrière qui
# n'existe pas (/stub/career) : il n'écrit rien.
# attendu(submit__decide): proceed=true path=auto
# attendu(submit__arm): clear=true
# attendu(record): ok=false stage=submit status=APPLY_UNPROVEN status_written=false
