<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit candidatures</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Papier crème et encre brune, un seul accent (lie-de-vin) ; neutres teintés chaud, jamais de gris pur ni de blanc pur.
     Un seul thème, clair, même si Windows est en mode sombre : le cockpit se lit comme un dossier papier. */
  :root {
    color-scheme: light;
    --bg:#f3ede2; --surface:#f8f3ea; --raised:#fdfaf4; --ink:#2e2822; --ink-2:#4f473e; --ink-3:#6f6457;
    --line:#e4d9c7; --line-2:#d3c5ae; --accent:#7a2f42; --accent-ink:#fbf4ec; --accent-soft:#f0e0de;
    --ok:#4e6b3d; --ok-soft:#e5ead8; --warn:#8a5b14; --warn-soft:#f4e6c8; --bad:#a63a24; --bad-soft:#f5ddd3;
    --sel:#efe4d6; --focus:#7a2f42;
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Instrument Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono:"IBM Plex Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.55 var(--sans); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  button, input, textarea { font:inherit; color:inherit; }
  [hidden] { display:none !important; } /* un bouton `.btn` caché par l'attribut le reste malgré son display:inline-flex */
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  code { font:12.5px var(--mono); }

  /* ── Structure : barre, liste, fiche ───────────────────────────────── */
  .top { height:52px; display:flex; align-items:center; gap:20px; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--line); }
  .top h1 { font:600 17px/1.2 var(--serif); margin:0; letter-spacing:-.01em; }
  .top .vm { display:flex; align-items:center; gap:10px; color:var(--ink-2); font-size:12.5px; }
  .top .flight { margin-left:auto; color:var(--ink-2); font-size:12.5px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ink-3); vertical-align:1px; margin-right:6px; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); } .dot.live { background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  main { display:grid; grid-template-columns:380px minmax(0,1fr); height:calc(100% - 52px); }
  @media (max-width:900px) {
    main { grid-template-columns:1fr; height:auto; } .pane { height:auto; max-height:none; } #list { max-height:55vh; border-right:0; border-bottom:1px solid var(--line); }
    /* Écran étroit : la barre passe sur plusieurs lignes plutôt que de couper un libellé. */
    .top { height:auto; min-height:52px; flex-wrap:wrap; gap:6px 16px; padding:10px 16px; } .top .vm { flex-wrap:wrap; } .top .flight { margin-left:0; width:100%; }
    .tools { padding-left:16px; padding-right:16px; } .radar { padding-left:16px; padding-right:16px; } .offer { padding-left:14px; padding-right:16px; } .batch, .log { padding-left:16px; padding-right:16px; }
  }
  .pane { height:100%; overflow:auto; }
  #list { border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; }
  #detail { background:var(--bg); }

  /* ── Liste des offres ───────────────────────────────────────────────── */
  .tools { padding:12px 14px 8px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); }
  .search { width:100%; height:34px; padding:0 10px; border:1px solid var(--line-2); border-radius:6px; background:var(--raised); }
  .search::placeholder { color:var(--ink-3); }
  .seg { display:inline-flex; flex:none; border:1px solid var(--line-2); border-radius:6px; overflow:hidden; }
  .seg button { height:28px; padding:0 12px; border:0; background:transparent; color:var(--ink-2); cursor:pointer; white-space:nowrap; flex:none; }
  .seg button.on { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .tools .meta { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; color:var(--ink-3); }
  .tools .meta #count { text-align:right; min-width:0; }
  .offers { list-style:none; margin:0; padding:0; flex:1; }
  .offer { display:grid; grid-template-columns:24px 1fr auto; gap:0 10px; padding:10px 14px 10px 12px; border-bottom:1px solid var(--line); cursor:pointer; align-items:start; }
  .offer:hover { background:var(--raised); }
  .offer.sel { background:var(--sel); box-shadow:inset 3px 0 0 var(--accent); }
  .offer input { margin:3px 0 0; width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
  .offer .co { font-weight:600; letter-spacing:-.005em; }
  .offer .ti { color:var(--ink-2); }
  .offer .mt { font-size:12px; color:var(--ink-3); margin-top:2px; }
  .offer .st { font-size:12px; margin-top:4px; }
  .offer .sc { font-variant-numeric:tabular-nums; font-weight:500; text-align:right; }
  .offer .sc small { display:block; color:var(--ink-3); font-weight:400; font-size:11.5px; }
  .offer .sc.forte { color:var(--ok); } .offer .sc.faible { color:var(--ink-3); } .offer .sc.none { color:var(--ink-3); font-weight:400; font-size:12px; }
  .empty { padding:28px 16px; color:var(--ink-3); text-align:center; }
  .batch { position:sticky; bottom:0; padding:10px 14px; background:var(--raised); border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .log { padding:8px 14px; font-size:12px; color:var(--ink-3); border-top:1px solid var(--line); }
  .log summary { cursor:pointer; } .log pre { margin:6px 0 0; }
  /* ── Relève des sources (career-radar) : dernière relève, ou relève en cours ─────── */
  .radar { padding:8px 14px; font-size:12px; color:var(--ink-2); border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
  .radar details { margin-top:3px; } .radar summary { cursor:pointer; color:var(--ink-3); }
  .radar ul { list-style:none; margin:4px 0 0; padding:0; } .radar li { padding:2px 0; } .radar li b { font-weight:500; color:var(--ink); }
  .radar .added { margin:4px 0 0; color:var(--ink-3); }

  /* ── Vues de la liste : offres du tableau, sélection du jour, entreprises full remote ── */
  .views { display:flex; flex-wrap:wrap; gap:0; padding:6px 8px 0; border-bottom:1px solid var(--line); }
  .views button { height:34px; padding:0 8px; border:0; border-bottom:2px solid transparent; background:transparent; color:var(--ink-2); cursor:pointer; margin-bottom:-1px; white-space:nowrap; font-size:13px; }
  .views button:hover { color:var(--ink); }
  .views button.on { color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
  .views .n { font-size:11.5px; color:var(--ink-3); margin-left:4px; font-variant-numeric:tabular-nums; font-weight:400; }
  .views button.on .n { color:var(--accent); }
  @media (max-width:420px) { .views { padding:4px 4px 0; } .views button { padding:0 6px; font-size:12.5px; } }
  .offer.row2 { grid-template-columns:1fr auto; padding-left:14px; }
  .rjobs { list-style:none; margin:18px 0 0; padding:0; max-width:84ch; }
  .rjobs li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 14px; padding:11px 0; border-bottom:1px solid var(--line); align-items:center; }
  .rjobs li b { font-weight:600; } .rjobs .mt { font-size:12px; color:var(--ink-3); margin-top:2px; }
  @media (max-width:600px) { .rjobs li { grid-template-columns:1fr; } .rjobs li .btn { justify-self:start; } }

  /* ── Fiche ───────────────────────────────────────────────────────────── */
  .fiche { max-width:920px; padding:24px 28px 48px; }
  .hd h2 { font:600 26px/1.2 var(--serif); margin:0; letter-spacing:-.015em; }
  .hd .ti { font-size:15px; color:var(--ink-2); margin:2px 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--ink-2); font-size:12.5px; }
  .chips b { font-weight:500; color:var(--ink); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px; align-items:center; }
  .btn { height:34px; padding:0 14px; border-radius:6px; border:1px solid var(--line-2); background:var(--raised); cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn:hover { border-color:var(--ink-3); text-decoration:none; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500; }
  .btn.go { background:var(--ok); border-color:var(--ok); color:var(--accent-ink); font-weight:500; }
  .btn.danger { color:var(--bad); border-color:var(--bad); background:transparent; }
  .btn.quiet { border-color:transparent; background:transparent; color:var(--ink-2); }
  .btn:disabled { opacity:.5; cursor:default; }
  .note { font-size:12.5px; color:var(--ink-2); margin:6px 0; }
  .para { margin:10px 0; }
  .banner { margin:16px 0; padding:14px 16px; border-left:3px solid var(--warn); background:var(--warn-soft); border-radius:0 6px 6px 0; }
  .banner.info { border-color:var(--accent); background:var(--accent-soft); }
  .banner.bad { border-color:var(--bad); background:var(--bad-soft); }
  .banner.ok { border-color:var(--ok); background:var(--ok-soft, var(--accent-soft)); }
  .banner.warn { border-color:var(--warn); background:var(--warn-soft); }
  .tri { display:inline-block; padding:0 6px; border-radius:4px; font-size:11.5px; line-height:18px; background:var(--line-2); color:var(--ink-2); cursor:help; }
  .tri.bad { background:var(--bad-soft); color:var(--bad); } .tri.ok { background:var(--ok-soft, var(--accent-soft)); color:var(--ok); } .tri.warn { background:var(--warn-soft); color:var(--warn); }
  #hideWrap { font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; color:var(--ink-3); white-space:nowrap; } #hideWrap input { margin:0; accent-color:var(--accent); }
  .banner h3 { margin:0 0 4px; font:600 15px/1.3 var(--serif); }
  .banner .actions { margin:12px 0 0; }
  textarea { width:100%; min-height:72px; padding:10px; border:1px solid var(--line-2); border-radius:6px; background:var(--raised); resize:vertical; }
  .tabs { display:flex; flex-wrap:wrap; gap:2px; margin:20px 0 0; border-bottom:1px solid var(--line); }
  .tabs button { height:36px; padding:0 12px; border:0; border-bottom:2px solid transparent; background:transparent; color:var(--ink-2); cursor:pointer; margin-bottom:-1px; white-space:nowrap; }
  .tabs button:hover { color:var(--ink); }
  .tabs button.on { color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
  #tabBody { padding-top:16px; }
  .facts { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0 0 14px; }
  .facts dt { color:var(--ink-3); font-size:12.5px; padding-top:1px; } .facts dd { margin:0; }
  .src { font-size:12px; color:var(--ink-3); margin:0 0 6px; font-family:var(--mono); }
  pre { margin:0 0 16px; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:auto; max-height:70vh; white-space:pre-wrap; font:12.5px/1.5 var(--mono); }
  .doc { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:22px 26px; margin:0 0 16px; max-width:72ch; }
  .doc h3 { font:600 19px/1.3 var(--serif); margin:0 0 10px; } .doc h4 { font-size:14px; margin:16px 0 6px; } .doc h5 { font-size:13.5px; margin:12px 0 4px; color:var(--ink-2); }
  .doc p { margin:0 0 8px; } .doc ul, .doc ol { margin:0 0 8px; padding-left:20px; } .doc li { margin:2px 0; } .doc hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  .steps { list-style:none; margin:0; padding:0; max-width:60ch; }
  .steps li { display:grid; grid-template-columns:18px 1fr auto; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); align-items:center; }
  .steps li .state { font-size:12px; color:var(--ink-3); white-space:nowrap; }
  .steps li.live { background:var(--accent-soft); margin:0 -8px; padding:6px 8px; border-radius:4px; }
  .bar { height:4px; background:var(--line); border-radius:2px; margin:8px 0 14px; max-width:60ch; overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
  .form { width:100%; border-collapse:collapse; margin:0 0 16px; font-size:13px; }
  .form th { text-align:left; font-weight:500; color:var(--ink-3); font-size:12px; padding:6px 10px 6px 0; border-bottom:1px solid var(--line-2); }
  .form td { padding:7px 10px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .form td.v { word-break:break-word; } .form tr.off td { color:var(--ink-3); } .form td.src { font-family:var(--mono); font-size:12px; color:var(--ink-3); }
  .kv { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:6px 16px; margin:0 0 16px; max-width:80ch; }
  .kv dt { color:var(--ink-3); font-size:12.5px; padding-top:1px; } .kv dd { margin:0; word-break:break-word; } .kv dd .kv { margin:0; }
  .jumps { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:8px 0 2px; }
  details.raw { margin:0 0 16px; } details.raw summary { cursor:pointer; color:var(--ink-3); font-size:12px; }
  .variants { margin:10px 0 0; padding:0; list-style:none; font-size:12.5px; color:var(--ink-2); } .variants li { padding:2px 0; }
  .steps li .dot { margin:0; }
  .remark { padding:8px 0 8px 12px; border-left:2px solid var(--line-2); margin:0 0 10px; white-space:pre-wrap; }
  .remark .at { display:block; font-size:12px; color:var(--ink-3); margin-bottom:2px; }
  .muted { color:var(--ink-3); } .err { color:var(--bad); }
  /* ── Ce qui attend ton geste (alerte « à toi ») : en tête de la liste, donc aussi en premier sur le téléphone ── */
  .attn { border-bottom:1px solid var(--line); background:var(--warn-soft); }
  .attn h2 { margin:0; padding:10px 14px 4px; font:600 14px/1.3 var(--serif); color:var(--warn); }
  .attn ul { list-style:none; margin:0; padding:0 0 6px; }
  .attn li { display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:6px 14px; cursor:pointer; align-items:start; }
  .attn li:hover { background:var(--raised); }
  .attn li b { font-weight:600; } .attn li span { grid-column:1; font-size:12px; color:var(--ink-2); }
  .attn li button { grid-row:1 / span 2; grid-column:2; height:24px; padding:0 8px; font-size:12px; }
  .attn li.go b { color:var(--accent); }
  .attn .old { padding:0 14px 8px; font-size:12px; color:var(--ink-3); }
  /* ── Run en cours, dans la fiche : l'étape, la barre, depuis quand ── */
  /* ── Postuler : l'ordre, puis le parcours jusqu'à « envoyée » ou « à envoyer toi-même » ── */
  .order { margin:16px 0 0; padding:16px; border:1px solid var(--line-2); border-radius:8px; background:var(--surface); max-width:72ch; }
  .order label { display:block; font-size:12.5px; color:var(--ink-2); margin:0 0 6px; }
  .order textarea { min-height:56px; }
  .order .actions { margin:12px 0 0; }
  .order .note { margin:8px 0 0; }
  .journey { list-style:none; margin:16px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:8px 0; max-width:72ch; counter-reset:j; }
  .journey li { flex:1 1 0; min-width:96px; position:relative; padding:24px 8px 0 0; font-size:12.5px; color:var(--ink-3); }
  .journey li::before { content:''; position:absolute; top:7px; left:0; right:0; height:2px; background:var(--line-2); }
  .journey li::after { content:''; position:absolute; top:2px; left:0; width:12px; height:12px; border-radius:50%; background:var(--raised); border:2px solid var(--line-2); box-sizing:border-box; }
  .journey li.done { color:var(--ink-2); } .journey li.done::before, .journey li.done::after { background:var(--ok); border-color:var(--ok); }
  .journey li.now { color:var(--ink); font-weight:600; } .journey li.now::after { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .journey li.bad { color:var(--bad); font-weight:600; } .journey li.bad::after { background:var(--bad); border-color:var(--bad); }
  .journey li.warn { color:var(--warn); font-weight:600; } .journey li.warn::after { background:var(--warn); border-color:var(--warn); }
  .journey li.skip { text-decoration:line-through; }
  @media (max-width:600px) {
    .journey { flex-direction:column; gap:0; }
    .journey li { flex:none; min-width:0; padding:0 0 12px 24px; }
    .journey li::before { top:0; bottom:0; left:5px; right:auto; width:2px; height:auto; }
    .journey li:last-child::before { display:none; }
    .journey li::after { top:3px; }
  }
  .received { font-size:12.5px; color:var(--ink-2); margin:8px 0 0; }
  .runband { margin:14px 0 0; padding:12px 14px; border-radius:6px; background:var(--accent-soft); border-left:3px solid var(--accent); }
  .runband b { font-weight:600; } .runband .bar { margin:8px 0 4px; background:var(--raised); }
  .runband .sub { font-size:12px; color:var(--ink-2); }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 3px var(--accent-soft); } 50% { box-shadow:0 0 0 5px var(--accent-soft); } }
  .dot.live { animation:pulse 1.6s ease-in-out infinite; }
  .person { padding:12px 0; border-bottom:1px solid var(--line); max-width:80ch; }
  .person h4 { margin:0; font-size:15px; } .person .role { color:var(--ink-2); }
  .person .why { margin:4px 0 6px; } .person .jumps { margin:6px 0 0; }
  .msg { max-width:80ch; margin:0 0 16px; } .msg pre { margin:6px 0 6px; max-height:none; }
  .msg .count { font-size:12px; color:var(--ink-3); } .msg h3 { margin:0; font:600 15px/1.3 var(--serif); }
  .foot { padding:14px 28px; font-size:12px; color:var(--ink-3); font-family:var(--mono); }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Cockpit candidatures</h1>
  <div class="vm"><span id="pullState"></span><button class="btn quiet" id="pull" style="height:28px;padding:0 8px">Rafraîchir</button><button class="btn quiet" id="radar" style="height:28px;padding:0 8px" hidden>Relever les sources</button></div>
  <div class="flight" id="live"></div>
</header>
<main>
  <section class="pane" id="list">
    <div class="attn" id="attention" hidden></div>
    <nav class="views" id="views" aria-label="Vues"><button data-v="offres" class="on" title="Le tableau des offres">Offres</button><button data-v="selection" title="Les offres choisies chaque matin par la sélection du jour, avec ta réponse">Sélectionnées<span class="n" id="nSel"></span></button><button data-v="remote" title="Toutes les entreprises full remote trouvées par le radar, et leurs postes de ton champ, quel que soit le tri">Entreprises full remote</button><button data-v="signals" title="Les entreprises qui bougent : levée, nouveau CMO, vague de recrutement, nouvel outil marketing, ouverture d'un pays… avant que le poste soit publié">Signaux<span class="n" id="nSig"></span></button></nav>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Filtrer : entreprise, poste, lieu…" autocomplete="off">
      <div class="meta">
        <div class="seg" id="segOffres"><button data-f="todo" class="on" title="Offres retenues ou à vérifier par le tri, et celles où une candidature est en route">À traiter</button><button data-f="wait" title="Offres que le tri n'a pas encore lues">En tri</button><button data-f="all">Toutes</button></div>
        <div class="seg" id="segSel" hidden><button data-sf="todo" class="on" title="Pas encore de oui ni de non">À répondre</button><button data-sf="go">Oui</button><button data-sf="non">Non</button><button data-sf="all">Toutes</button></div>
        <div class="seg" id="segRemote" hidden><button data-rf="field" class="on" title="Les entreprises qui ont aujourd'hui au moins un poste de ton champ en full télétravail">Avec postes</button><button data-rf="full" title="Les entreprises dont presque tous les postes sont en full remote">100 % remote</button><button data-rf="all" title="Aussi celles qui n'ont rien pour toi en ce moment">Toutes</button></div>
        <div class="seg" id="segSig" hidden><button data-gf="fort" class="on" title="Les entreprises au score de signal le plus haut (≥ 1)">Fortes</button><button data-gf="remote" title="Seulement celles qui ont des postes en full remote">Remote</button><button data-gf="bon" title="Tes bonnes pistes et la file À prospecter">Mes pistes</button><button data-gf="all" title="Toutes, y compris les signaux faibles et négatifs">Toutes</button></div>
        <span id="count"></span>
      </div>
      <div class="meta" id="orderRow">
        <div class="seg" id="segSort" title="L'ordre de la liste"><button data-s="recent" class="on" title="Les offres publiées le plus récemment d'abord">Plus récentes</button><button data-s="pertinence" title="Retenues par le tri d'abord, la meilleure adéquation au cœur du poste devant, puis la plus récente">Pertinence</button></div>
        <div class="seg" id="segPeriod" title="Seulement les offres publiées depuis…"><button data-p="7">7 j</button><button data-p="14" class="on">14 j</button><button data-p="30">30 j</button><button data-p="0">Tout</button></div>
      </div>
      <div class="meta" id="hideRow" style="display:none">
        <label id="hideWrap" title="Les offres écartées par le tri (criteres.json) restent dans le tableau, mais sont cachées ici"><input type="checkbox" id="hideDiscarded" checked> masquer les écartées par le tri</label>
      </div>
      <div class="note" id="queue" style="display:none"></div>
    </div>
    <div class="radar" id="radarPanel"></div>
    <div class="radar" id="viewNote" hidden></div>
    <ul class="offers" id="offers"></ul>
    <div class="batch" id="batch" style="display:none"><button class="btn primary" id="launch"></button><span class="note">une à la fois, en mode confirm</span></div>
    <details class="log" id="errors" style="display:none"><summary></summary><pre id="errorsBody"></pre></details>
  </section>
  <section class="pane" id="detail"></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
/** Lecture par slug sans tomber sur le prototype (un slug « constructor » rendait la liste vide). */
const own = (o, k) => (o && Object.prototype.hasOwnProperty.call(o, k)) ? o[k] : null;
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '';
/** « 2026-10-22 » → « 22 oct. » ; une date qu'on ne sait pas lire reste telle quelle. */
/** « publiée il y a 45 j » : l'âge de l'annonce, toujours visible (Antoine, 2026-11-14 : une vieille offre du site de l'employeur reste une opportunité). */
const ageLabel = (o) => { const t = Date.parse(String(o.date || '').slice(0, 10)); if (!Number.isFinite(t)) return ''; const n = Math.max(0, Math.floor((Date.now() - t) / 86_400_000)); const a = n === 0 ? "publiée aujourd'hui" : n === 1 ? 'publiée hier' : n < 60 ? `publiée il y a ${n} j` : `publiée il y a ${Math.round(n / 30)} mois`; return o.seen && o.seen !== String(o.date).slice(0, 10) ? `${a} (trouvée le ${day(o.seen)})` : a; };
const day = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || '')); if (!m) return d || ''; const x = new Date(+m[1], +m[2] - 1, +m[3]); return x.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', ...(x.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) }); };
const srcName = (s) => String(s || '').replace(/\s*\(Live[^)]*\)\s*/i, '').trim();
/** Les annonces du tableau partagent souvent un slug (même poste publié par pays) : une ligne par slug, la plus récente devant. */
function groups() {
  const by = new Map();
  for (const o of S.offers) { const g = by.get(o.slug); if (g) g.rows.push(o); else by.set(o.slug, { slug: o.slug, main: o, rows: [o] }); }
  return [...by.values()];
}
/** Le tri d'un groupe : écartée si toutes le sont, retenue dès qu'une l'est, sinon à vérifier. */
function groupTriage(g) {
  const ts = g.rows.map((o) => o.triage).filter(Boolean); if (!ts.length) return null;
  if (ts.length === g.rows.length && ts.every((t) => t.decision === 'ecartee')) return ts[0];
  const best = ts.find((t) => t.decision === 'retenue') || ts.find((t) => t.decision === 'a_verifier');
  if (best) return best;
  // Seulement des « écartée » mais pas sur toutes les annonces : le tri n'est pas fini, on ne cache rien.
  return { decision: 'partiel', reasons: [`${ts.length} annonce${ts.length > 1 ? 's' : ''} sur ${g.rows.length} triée${ts.length > 1 ? 's' : ''} (écartée${ts.length > 1 ? 's' : ''}), le reste attend son tour`], stale: false };
}
/** La durée d'un run en cours : « depuis 4 min », « depuis 1 h 05 ». */
const since = (iso) => { if (!iso) return ''; const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 1 ? 'depuis moins d’une minute' : m < 60 ? `depuis ${m} min` : `depuis ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`; };
const LIVE = ['running', 'paused', 'waiting', 'pending', 'queued'];
/** La ligne d'état d'un run dans la liste : l'étape en cours et depuis quand, ou le go attendu. */
function runLine(run) {
  if (run.waitingLabel) return `<span class="dot warn"></span>ton go est attendu`;
  if (LIVE.includes(run.status)) return `<span class="dot live"></span>${esc(run.runningLabel || 'démarrage')} · ${since(run.startedAt)}`;
  return `<span class="dot bad"></span>${esc(run.statusLabel)}${run.progress.failed.length ? ' · ' + esc(run.progress.failed.join(', ')) : ''}`;
}
/** Copie un texte ; hors contexte sûr (le téléphone par Tailscale en http), par une zone de texte temporaire. */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok;
}
const ago = (iso) => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'à l’instant' : m < 60 ? `il y a ${m} min` : `à ${new Date(iso).toLocaleTimeString('fr-FR', { timeStyle: 'short' })}`; };
const STATUS = { PENDING_VALIDATION: ['à valider', ''], VALIDATED: ['validée', 'ok'], TAILORED: ['CV prêt', 'ok'], APPLYING: ['en cours', 'live'], APPLIED: ['envoyée', 'ok'], APPLY_UNPROVEN: ['envoi non prouvé', 'warn'], APPLY_FAILED: ['échec', 'bad'] };
const statusHtml = (s) => { const [label, cls] = own(STATUS, s) || [s, '']; return `<span class="dot ${cls}"></span>${esc(label)}`; };

let S = { offers: [], runs: {}, live: [], queue: [], errors: [], config: {}, pull: {}, triage: {}, radar: {}, attention: [], contacts: { runs: {} } };
let radarOpen = false;
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const dur = (ms) => ms < 1000 ? `${ms} ms` : `${(ms / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} s`;
/**
 * La relève des sources (career-radar) : le bouton de la barre (grisé, « relève en cours », tant qu'un run est
 * vivant) et le panneau sous les outils : dernière relève (sources OK / en échec, offres brutes, retenues,
 * ajoutées, le détail par source déplié à la demande), ou « Relève en cours… » avec l'étape. Les statuts
 * viennent du radar et ne nomment que des variables, jamais une valeur de clé.
 */
function renderRadar() {
  const r = S.radar || {}, p = r.report, btn = $('#radar');
  btn.hidden = !r.enabled;
  btn.disabled = !!r.live;
  btn.title = r.live ? 'relève en cours' : r.auto ? `lire les sources d'offres maintenant (sinon toutes les ${r.every} min)` : 'lire les sources d\'offres maintenant';
  let h;
  if (!r.enabled) h = `<span class="dot"></span>${esc(r.reason || 'relève arrêtée')}`;
  else if (r.live) h = `<span class="dot live"></span>Relève en cours… ${esc(r.live.stepLabel)}${r.live.progress && r.live.progress.total ? ` (${r.live.progress.done}/${r.live.progress.total} étapes)` : ''}`;
  else if (p) {
    const dot = p.failedCount ? (p.okCount ? 'warn' : 'bad') : 'ok';
    const sources = p.sources.map((s) => `<li><span class="dot ${s.kind}"></span><b>${esc(s.name)}</b> · ${esc(s.status)} · ${plural(s.count, 'offre', 'offres')} · ${dur(s.durationMs)}</li>`).join('');
    h = `<span class="dot ${dot}" data-at="${esc(p.at)}"></span>Dernière relève : ${ago(p.at)} · ${plural(p.okCount, 'source OK', 'sources OK')}, ${p.failedCount} en échec · ${plural(p.rawCount, 'offre brute', 'offres brutes')}, ${p.qualifiedCount} retenue${p.qualifiedCount > 1 ? 's' : ''}, ${p.added} ajoutée${p.added > 1 ? 's' : ''}
      <details id="radarDetails"${radarOpen ? ' open' : ''}><summary>${plural(p.sources.length, 'source', 'sources')}${p.rejectedCount ? ` · ${plural(p.rejectedCount, 'offre écartée aux contrôles', 'offres écartées aux contrôles')}` : ''}</summary><ul>${sources || '<li class="muted">aucune source dans le rapport</li>'}</ul>${p.addedSlugs.length ? `<p class="added">ajoutées au tableau : ${p.addedSlugs.map(esc).join(', ')}</p>` : ''}</details>`;
  } else h = `<span class="dot"></span>aucune relève encore${r.auto ? ` : la première part 60 s après le démarrage du cockpit, puis toutes les ${r.every} min` : ''}${r.reason ? ` · ${esc(r.reason)}` : ''}`;
  if (r.reportError) h += ` <span class="err">${esc(r.reportError)}</span>`;
  put($('#radarPanel'), h, () => { const d = $('#radarDetails'); if (d) d.addEventListener('toggle', () => { radarOpen = d.open; }); });
}
let selected = null, tab = 'annonce', cache = {}, checked = new Set(), filter = 'todo', query = '', hideDiscarded = true;
// L'ordre et la période de la liste (Antoine, 2026-11-13 : les plus récentes d'abord, ou par pertinence, avec un filtre de date), gardés d'une visite à l'autre.
let sortBy = 'recent', period = 14;
try { const v = localStorage.getItem('cockpit.sort'); if (v === 'recent' || v === 'pertinence') sortBy = v; const p = Number(localStorage.getItem('cockpit.period')); if ([0, 7, 14, 30].includes(p) && localStorage.getItem('cockpit.period') !== null) period = p; } catch {}
// Les vues de la liste : le tableau (offres), la sélection du jour (sélectionnées), les entreprises full remote (remote).
let view = 'offres', selFilter = 'todo', remoteFilter = 'field', R = null, remoteAt = 0, selectedCo = null;
try { const v = localStorage.getItem('cockpit.view'); if (['offres', 'selection', 'remote', 'signals'].includes(v)) view = v; } catch {}
const TRIAGE = { ecartee: ['écartée', 'bad'], a_verifier: ['à vérifier', 'warn'], retenue: ['retenue', 'ok'], partiel: ['en cours', ''] };
/** Le badge du tri (career-triage) : décision, et en survol les raisons. */
/** L'adéquation au cœur du poste (note du tri), à la place du score du radar qui ne départageait rien. */
const FIT = { forte: 'forte', moyenne: 'moyenne', faible: 'faible' };
const fitTitle = (f) => f ? `Cœur du poste : ${f.proven} exigence${f.proven > 1 ? 's' : ''} sur ${f.total} étayée${f.proven > 1 ? 's' : ''} par ton profil, ${f.partial} en partie, ${f.missing} absente${f.missing > 1 ? 's' : ''}` : '';
const fitCell = (t) => { const f = t && t.fit; if (f) return `<div class="sc ${f.level}" title="${esc(fitTitle(f))}">${esc(FIT[f.level])}<small>adéquation</small></div>`; return `<div class="sc none">${!t ? 'à trier' : t.decision === 'partiel' ? 'en tri' : ''}</div>`; };
/** Une offre où il s'est passé quelque chose (préparée, envoyée, run en cours) : toujours à traiter, quel que soit le tri. */
const fromRemote = (o) => /^Entreprise full remote/.test(o.source || '');
const touched = (o) => !!own(S.runs, o.slug) || !!o.harness || fromRemote(o) || !['PENDING_VALIDATION', 'VALIDATED', ''].includes(o.status || '');
const RANK = { forte: 0, moyenne: 1, '': 2, faible: 3 };
/** En cours pour de vrai (un run qui tourne, une candidature en vol, en file) : toujours en haut, quelle que soit la date. Une offre seulement « touchée » autrefois (envoyée, en échec, CV fait) reprend sa place par date. */
const inProgress = (g) => g.rows.some((o) => liveRun(o.slug) || o.status === 'APPLYING' || (S.queue || []).includes(o.slug));
/** « Pertinence » : retenues avant les « à vérifier », la meilleure adéquation au cœur du poste devant ; à égalité, la plus récente. */
const relevanceRank = (g) => { const t = groupTriage(g); return (t && t.decision === 'retenue' ? 0 : 4) + RANK[(t && t.fit && t.fit.level) || '']; };
/** L'âge en jours de la plus récente annonce du groupe, depuis son ajout quand Antoine l'a mise au tableau lui-même (null : date absente ou illisible, gardée). */
const ageDays = (g) => { const r = g.rows[0]; const d = Date.parse(String((r && (r.added || r.seen || r.date)) || '').slice(0, 10)); return Number.isFinite(d) ? (Date.now() - d) / 86_400_000 : null; };
const triageHtml = (t) => { if (!t) return ''; const [label, cls] = own(TRIAGE, t.decision) || [t.decision, '']; return `<span class="tri ${cls}" title="${esc((t.reasons || []).join('\n'))}">tri : ${esc(label)}${t.stale ? ' (à refaire)' : ''}</span>`; };
let detailLast = '';

/** Ce qui attend ton geste (go, compte à ouvrir, candidature à finir, envoi à vérifier, étape en échec) : un clic ouvre la fiche, « vu » range l'alerte jusqu'à ce que la situation change. */
function renderAttention() {
  const items = S.attention || [], todo = items.filter((i) => !i.seen), old = items.filter((i) => i.seen);
  const el = $('#attention'); el.hidden = !items.length;
  const who = S.candidate && S.candidate.name ? ` · ${S.candidate.name}` : '';
  const title = `${todo.length ? `(${todo.length}) ` : ''}Cockpit${who}`; if (document.title !== title) document.title = title;
  put(el, items.length ? `<h2>À toi${todo.length ? ` (${todo.length})` : ''}</h2>${todo.length ? `<ul>${todo.map((i) => `<li class="${esc(i.kind)}" data-slug="${esc(i.slug)}"><b>${esc(i.title)}</b><button class="btn quiet" data-seen="${esc(i.key)}" title="Ranger cette alerte : elle revient si la situation change">vu</button><span>${esc(i.detail)}</span></li>`).join('')}</ul>` : ''}${old.length ? `<p class="old">${plural(old.length, 'alerte vue', 'alertes vues')} : ${old.map((i) => `<a href="#${encodeURIComponent(i.slug)}" data-slug="${esc(i.slug)}">${esc(i.company)}</a>`).join(', ')}</p>` : ''}` : '');
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  return r.json();
}
/** Ne redessine que si le contenu change : la saisie, le défilement et le focus survivent au rafraîchissement. */
function put(el, html, bind) {
  if (!el || el._last === html) return;
  el._last = html; el.innerHTML = html;
  if (bind) bind();
}

async function refresh() {
  try { S = await api('/api/state'); } catch (e) { $('#live').innerHTML = `<span class="dot bad"></span>cockpit injoignable`; return; }
  const who = S.candidate && S.candidate.name ? ` · ${S.candidate.name}` : '';
  if ($('#title').textContent !== `Cockpit candidatures${who}`) $('#title').textContent = `Cockpit candidatures${who}`;
  renderAttention();
  const p = S.pull || {};
  $('#pull').hidden = !p.command;
  $('#pull').disabled = !!p.running;
  put($('#pullState'), p.running ? `<span class="dot live"></span>lecture du tableau de la VM…`
    : p.at ? (p.ok ? `<span class="dot ok"></span>tableau de la VM fusionné ${ago(p.at)}` : `<span class="dot bad"></span><span class="err" title="${esc(p.output)}">VM : échec ${ago(p.at)}</span>`)
    : !p.command ? `<span class="dot"></span>${esc(p.output || 'tableau du PC seulement')}`
    : (p.every ? `<span class="dot"></span>premier rafraîchissement…` : `<span class="dot"></span>tableau du PC seulement`));
  renderRadar();
  const t = S.triage || {};
  const tri = t.live ? `  <span class="dot live"></span>tri de ${esc(t.live.slug || t.live.key)}` : t.enabled && t.waiting ? `  <span class="dot"></span>${t.waiting} offre${t.waiting > 1 ? 's' : ''} à trier` : '';
  const cl = Object.entries((S.contacts || {}).runs || {}).filter(([, r]) => LIVE.includes(r.status)).map(([slug]) => `  <span class="dot live"></span>décideurs de ${esc(slug)}`).join('');
  put($('#live'), (S.runsLoading ? `<span class="dot live"></span>lecture des runs…`
    : S.live.length ? S.live.map((l) => { const r = own(S.runs, l.slug) || {}; return `<span class="dot ${r.waitingLabel ? 'warn' : 'live'}"></span>${esc(l.slug)} · ${esc(r.waitingLabel ? 'ton go est attendu' : r.runningLabel || r.statusLabel || l.status)}${r.waitingLabel ? '' : ' · ' + since(r.startedAt)}`; }).join('  ') : `<span class="dot"></span>aucune candidature en vol`) + tri + cl);
  renderList();
  if (!(document.activeElement && document.activeElement.matches('#detail textarea'))) renderDetail();
}

/** Un run encore en cours (pas un run fini ou échoué de l'historique). */
const liveRun = (slug) => { const r = own(S.runs, slug); return !!r && ['running', 'paused', 'waiting', 'pending', 'queued'].includes(r.status); };
/** Une annonce écartée par le tri, cachée quand la case est cochée, sauf si un run EN COURS la tient (un ancien run ne la garde plus). */
const hidden = (o) => hideDiscarded && o.triage && o.triage.decision === 'ecartee' && !liveRun(o.slug) && o.status !== 'APPLYING' && !fromRemote(o);
/**
 * Les groupes à afficher, réduits à leurs annonces visibles : le radar donne parfois le même slug à
 * des annonces différentes (Darkroom et une annonce Smartness en allemand), et une annonce écartée ne
 * doit pas rester visible parce qu'une voisine de même slug ne l'est pas.
 */
function visible() {
  const q = query.trim().toLowerCase();
  const show = (o) => (filter === 'all' || o.launch.ok || own(S.runs, o.slug) || o.status === 'APPLYING')
    && !hidden(o)
    && (!q || `${o.company} ${o.title} ${o.location} ${o.source}`.toLowerCase().includes(q));
  const out = groups().map((g) => { const rows = g.rows.filter(show); return rows.length ? { ...g, main: rows[0], rows } : null; }).filter(Boolean)
    .filter((g) => { if (filter === 'all') return true; const t = groupTriage(g), sorted = !!t && t.decision !== 'partiel'; return filter === 'wait' ? !sorted && !g.rows.some(touched) : sorted || g.rows.some(touched); });
  // La période ne cache jamais ce qui est en cours, ni une recherche par nom (on cherche aussi les vieilles).
  const inPeriod = (g) => period === 0 || q !== '' || inProgress(g) || (() => { const a = ageDays(g); return a === null || a <= period + 0.99; })();
  const kept = out.filter(inPeriod);
  // Le serveur rend les offres de la plus récente à la plus ancienne : à rang égal, cet ordre reste (tri stable).
  const order = new Map(kept.map((g, i) => [g, i]));
  kept.sort((a, b) => (inProgress(b) ? 1 : 0) - (inProgress(a) ? 1 : 0) || (sortBy === 'pertinence' ? relevanceRank(a) - relevanceRank(b) : 0) || order.get(a) - order.get(b));
  return kept;
}

function renderList() {
  viewChrome();
  if (view !== 'offres') {
    $('#hideRow').style.display = 'none'; $('#batch').style.display = 'none'; $('#queue').style.display = 'none';
    if (view === 'selection') renderSelectionList(); else if (view === 'signals') renderSignalList(); else renderRemoteList();
    renderErrors();
    return;
  }
  const rows = visible();
  const all = groups();
  const discarded = S.offers.filter((o) => o.triage && o.triage.decision === 'ecartee').length;
  $('#hideRow').style.display = discarded ? '' : 'none';
  const dup = S.offers.length - all.length;
  const waiting = all.filter((g) => { const t = groupTriage(g); return (!t || t.decision === 'partiel') && !g.rows.some(touched); }).length;
  $('#count').textContent = `${rows.length} offre${rows.length > 1 ? 's' : ''}${filter !== 'wait' && waiting ? ` · ${waiting} en tri` : ''}${discarded ? ` · ${discarded} écartée${discarded > 1 ? 's' : ''}${hideDiscarded ? ' (masquées)' : ''}` : ''}`;
  $('#count').title = dup ? `${S.offers.length} annonces dans le tableau, groupées par poste (${dup} doublon${dup > 1 ? 's' : ''})` : `${S.offers.length} annonces dans le tableau`;
  const q = $('#queue'); q.style.display = S.queue.length ? '' : 'none'; q.textContent = S.queue.length ? `En file : ${S.queue.join(', ')}` : '';
  put($('#offers'), rows.length ? rows.map((g) => {
    const o = g.main, run = own(S.runs, o.slug), t = groupTriage(g);
    const cr = own((S.contacts || {}).runs, o.slug);
    const st = (run && (LIVE.includes(run.status) || run.status === 'failed') ? runLine(run)
      : (o.status !== 'PENDING_VALIDATION' ? statusHtml(o.status) : '') + (o.harness ? ` <span class="muted" title="${esc(o.harness.summary)}">${o.status !== 'PENDING_VALIDATION' ? '· ' : 'dernier passage : '}${esc(o.harness.stage)} ${when(o.harness.at)}</span>` : ''))
      + (cr && LIVE.includes(cr.status) ? ` · <span class="dot live"></span>décideurs…` : '');
    const places = [...new Set(g.rows.map((r) => r.location).filter(Boolean))];
    const where = g.rows.length > 1 ? `${g.rows.length} annonces · ${places.slice(0, 3).join(', ')}${places.length > 3 ? '…' : ''}` : o.location;
    return `<li class="offer ${selected === o.slug ? 'sel' : ''}" data-slug="${esc(o.slug)}">
      <input type="checkbox" data-check="${esc(o.slug)}" ${checked.has(o.slug) ? 'checked' : ''} ${o.launch.ok ? '' : 'disabled title="' + esc(o.launch.reason) + '"'}>
      <div><div class="co">${esc(o.company)}</div><div class="ti">${esc(o.title)}</div>
        <div class="mt">${[where, srcName(o.source), ageLabel(o) || day(o.date)].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="st">${st}${t ? ' ' + triageHtml(t) : ''}</div></div>
      ${fitCell(t)}</li>`;
  }).join('') : `<li class="empty">${S.offers.length ? 'Aucune offre ne correspond au filtre.' : 'Le tableau est vide.'}</li>`);
  const b = $('#batch'); b.style.display = checked.size ? '' : 'none';
  $('#launch').textContent = checked.size > 1 ? `Postuler à ${checked.size} offres` : 'Postuler à cette offre';
  renderErrors();
}
function renderErrors() {
  const e = $('#errors'); e.style.display = S.errors.length ? '' : 'none';
  if (S.errors.length) { e.querySelector('summary').textContent = `${S.errors.length} message${S.errors.length > 1 ? 's' : ''} du cockpit`; put($('#errorsBody'), esc(S.errors.join('\n'))); }
}

// ── Vues « Sélectionnées » et « Entreprises full remote » ───────────────────────────
const LIST_MAX = 300;

}
function bindCompany() {

function select(slug, byKeyboard = false) {

/**
 * Le parcours d'une candidature, de l'ordre à l'issue : ordre reçu → CV, lettre, formulaire → ton go → envoi → envoyée.
 * Lu dans ce que le cockpit sait déjà : la file, le run vivant (étape en cours, attente du go) et le statut que `record`
 * écrit au tableau (APPLIED, APPLY_UNPROVEN, APPLY_FAILED, TAILORED = pièces prêtes, à envoyer toi-même).
 */
function journeyHtml(o, run, inQueue, live, launching) {
  const order = own(S.orders || {}, o.slug);
  const ended = !live && !inQueue;
  const st = o.status;
  const steps = ['Ordre reçu', 'CV, lettre, formulaire', 'Ton go', 'Envoi', 'Envoyée'];
  if (ended && st === 'APPLY_UNPROVEN') steps[4] = 'Reçu non prouvé';
  if (ended && st === 'TAILORED') steps[4] = 'À envoyer toi-même';
  let cls = null, outcome = '';
  const stepIds = (run && run.steps || []);
  const runningIds = stepIds.filter((x) => x.kind === 'live' || x.state === 'running').map((x) => x.id);
  const goDone = stepIds.some((x) => /^submit__go$/.test(x.id) && x.kind === 'ok');
  if (inQueue || launching) cls = ['done', 'now', '', '', ''];
  else if (live && run && run.waitingLabel) cls = ['done', 'done', 'now', '', ''];
  else if (live && goDone && runningIds.some((id) => id.startsWith('submit__'))) cls = ['done', 'done', 'done', 'now', ''];
  else if (live) cls = ['done', 'now', '', '', ''];
  else if (ended && st === 'APPLIED') { cls = ['done', 'done', 'done', 'done', 'done']; outcome = `<div class="banner ok"><h3>Candidature envoyée</h3>Le reçu de la plateforme est prouvé${o.harness && o.harness.at ? ` (${when(o.harness.at)})` : ''}.</div>`; }
  else if (ended && st === 'APPLY_UNPROVEN') { cls = ['done', 'done', 'done', 'done', 'warn']; outcome = `<div class="banner warn"><h3>Envoi fait, reçu non prouvé</h3>Le formulaire a été soumis mais la confirmation n'a pas été vue. Vérifie ta boîte mail ou la page de la plateforme.${o.harness && o.harness.summary ? `<p class="note">${esc(o.harness.summary)}</p>` : ''}</div>`; }

  else if (ended && st === 'TAILORED' && (run || o.harness)) {

      <div class="jumps">${isUrl(url) ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir la page de candidature ↗</a>` : ''}<button class="btn quiet" data-jump="contacts">Message aux décideurs</button></div><p class="note">Le CV et la lettre à joindre : boutons « en PDF » en haut de la fiche.</p></div>`;

  return `<ol class="journey">${steps.map((label, i) => `<li class="${cls[i]}">${label}</li>`).join('')}</ol>${received}${outcome}`;
}

/** Markdown minimal et sûr (le texte est échappé d'abord) : titres, listes, gras, italique, code, liens http(s). */
function md(text) {
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.replace(/\r\n?/g, '\n').split('\n')) {
    const line = raw.trimEnd();
    let m;
    if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) { flush(); out.push(`<h${m[1].length + 2}>${inline(m[2])}</h${m[1].length + 2}>`); }
    else if (/^(-{3,}|\*{3,})$/.test(line)) { flush(); out.push('<hr>'); }
    else if ((m = /^\s*[-*•]\s+(.*)$/.exec(line))) { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } if (list !== 'ul') { if (list) out.push(`</${list}>`); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } if (list !== 'ol') { if (list) out.push(`</${list}>`); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (line.trim() === '') flush();
    else { if (list) { out.push(`</${list}>`); list = null; } para.push(line.trim()); }
  }
  flush();
  return out.join('\n');
}

function find(files, re) { return (files || []).find((f) => re.test(f.path)); }
const LABELS = { name: 'Nom', email: 'E-mail', phone: 'Téléphone', linkedin: 'LinkedIn', portfolio: 'Portfolio', location: 'Localisation', availability: 'Disponibilité', answers: 'Réponses préparées', role: 'Rôle', company: 'Entreprise', source: 'Source', confidence: 'Confiance', reason: 'Raison', url: 'Page', platform: 'Plateforme', status: 'Statut', summary: 'Résumé', ok: 'Vérifié', submitted: 'Envoyé', at: 'Quand', problems: 'Problèmes', evidence: 'Preuves', notes: 'Notes' };
const label = (k) => LABELS[k] || String(k).replace(/_/g, ' ');
const isUrl = (v) => typeof v === 'string' && /^https?:\/\//.test(v);
/** Un objet JSON lisible : clés traduites, valeurs à plat, objets et listes emboîtés. */
function kv(v, depth = 0) {
  if (v === null || v === undefined || v === '') return '<span class="muted">—</span>';
  if (typeof v === 'boolean') return v ? 'oui' : 'non';
  if (isUrl(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
  if (Array.isArray(v)) return v.length ? (v.every((x) => typeof x !== 'object' || x === null) ? esc(v.join(', ')) : `<ul style="margin:0;padding-left:18px">${v.map((x) => `<li>${kv(x, depth + 1)}</li>`).join('')}</ul>`) : '<span class="muted">aucun</span>';
  if (typeof v === 'object') { const ks = Object.keys(v); return ks.length ? `<dl class="kv">${ks.map((k) => `<dt>${esc(label(k))}</dt><dd>${kv(v[k], depth + 1)}</dd>`).join('')}</dl>` : '<span class="muted">—</span>'; }
  return esc(String(v));
}
function showJson(f, fallback, intro) {

  return `${intro ? `<p class="note">${intro}</p>` : ''}<p class="src">${esc(f.path)}</p>${kv(data)}<details class="raw"><summary>JSON brut</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
}
/** prefill.json (apply-submit) en clair : plateforme, champs remplis et leur source, questions sans réponse, pièces jointes, bouton d'envoi. */
function prefillView(f) {
  let p = null; try { p = JSON.parse(f.text); } catch { return show(f); }
  if (!p || typeof p !== 'object') return show(f);
  const fields = Array.isArray(p.fields) ? p.fields : [];
  const un = Array.isArray(p.unanswered) ? p.unanswered : [];
  const att = Array.isArray(p.attachments) ? p.attachments : [];
  const sc = p.submit_control || {};
  const url = p.final_url || p.apply_url || '';
  const head = `<dl class="kv">${p.platform ? `<dt>Plateforme</dt><dd>${esc(p.platform)}</dd>` : ''}${url ? `<dt>Formulaire</dt><dd>${kv(url)}</dd>` : ''}
    ${sc.label ? `<dt>Bouton d'envoi</dt><dd>« ${esc(sc.label)} » · ${sc.visible ? 'visible' : 'non visible'}, ${sc.enabled ? 'actif' : 'inactif'}</dd>` : ''}
    <dt>État</dt><dd>${p.submitted ? '<span class="dot warn"></span>le formulaire dit avoir envoyé (à vérifier sur la plateforme)' : p.blocked ? `<span class="dot bad"></span>bloqué : ${esc(p.blocker || '')}` : '<span class="dot ok"></span>prérempli, rien d\'envoyé'}</dd></dl>`;
  const rows = fields.map((x) => `<tr class="${x.status === 'skipped' ? 'off' : ''}"><td>${esc(x.label)}</td><td class="v">${x.value == null || x.value === '' ? '<span class="muted">laissé vide</span>' : esc(Array.isArray(x.value) ? x.value.join(', ') : String(x.value))}</td><td class="src">${esc(x.source || '')}</td></tr>`).join('');
  const table = fields.length ? `<table class="form"><thead><tr><th>Champ</th><th>Valeur</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="note">Aucun champ rempli.</p>';
  const unans = un.length ? `<div class="banner"><h3>${un.length} question${un.length > 1 ? 's' : ''} sans réponse</h3>Elles restent vides : la réponse vient de <code>reponses_formulaires.md</code> (tes réponses validées) ou du profil, jamais inventée.<ul>${un.map((u) => `<li>${esc(u.label)}${u.required ? ' <b>(obligatoire)</b>' : ''}${u.reason ? ` · ${esc(u.reason)}` : ''}</li>`).join('')}</ul></div>` : '';
  const files = att.length ? `<p class="note"><b>Pièces jointes :</b> ${att.map((a) => `${esc(a.file)} (${a.status === 'attached' ? 'jointe' : 'échec'})`).join(', ')}</p>` : '';
  return `<p class="src">${esc(f.path)}</p>${head}${unans}${table}${files}<details class="raw"><summary>JSON brut</summary><pre>${esc(JSON.stringify(p, null, 2))}</pre></details>`;

function show(f, fallback) {
  if (!f) return `<p class="note">${fallback}</p>`;
  if (f.text === null) return `<p class="note">${esc(f.path)} (${f.bytes} octets, pas un fichier texte)</p>`;

  let text = f.text;
  if (/\.json$/i.test(f.path)) { try { text = JSON.stringify(JSON.parse(text), null, 2); } catch {} }
  return `<p class="src">${esc(f.path)}</p><pre>${esc(text)}</pre>`;
}

    const cls = (s) => s.kind || '';
    const pct = run.progress.total ? Math.round(100 * run.progress.done / run.progress.total) : 0;
    put(el, `<p class="note">${run.progress.done} étape${run.progress.done > 1 ? 's' : ''} sur ${run.progress.total}${run.waitingLabel ? ` · en pause : ${esc(run.waitingLabel).toLowerCase()}` : run.progress.running.length ? ` · en cours : ${run.progress.running.map((i) => esc((run.steps.find((x) => x.id === i) || {}).label || i)).join(', ')}` : ''}</p>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <ul class="steps">${run.steps.map((s) => `<li class="${cls(s) === 'live' || cls(s) === 'warn' ? 'live' : ''}"><span class="dot ${cls(s)}"></span><span>${esc(s.label)}</span><span class="state">${esc(s.stateLabel || s.state)}</span></li>`).join('')}</ul>
      ${cache.art && cache.art.error ? `<p class="note">${esc(cache.art.error)}</p>` : ''}
      <p class="src" style="margin-top:12px">artefacts : ${esc(run.artifactsDir || '—')}</p>`);
  } else if (tab === 'CV') put(el, pdfNote('cv') + show(find(art, /^application\/CV\.md$/) || find(app, /CV_.*\.md$|^CV\.md$/), 'Pas encore de CV : la rédaction est en cours ou n\'a pas abouti.'));
  else if (tab === 'lettre') put(el, pdfNote('lettre') + show(find(art, /^application\/letter\.md$/) || find(app, /^Lettre_.*\.md$/), 'Pas encore de lettre : elle est écrite après le CV, vérifiée, puis jointe à l\'envoi quand le formulaire en prend une.'));
  else if (tab === 'candidat') put(el, showJson(find(art, /^application\/candidate\.json$/) || find(app, /candidate\.json$/), 'Pas encore de fiche candidat (ce que le formulaire recevra).', 'Ce que le formulaire recevra : chaque fait vient du profil maître, jamais inventé.'));
  else if (tab === 'contacts') put(el, contactsHtml(art, app), bindContacts);
  else if (tab === 'envoi') {
    const pre = find(art, /^submission\/prefill\.json$/);
    const rest = [find(art, /^submission\/receipt\.json$/), find(art, /^submission\/verdict\.json$/), find(app, /submission_receipt\.json$/)].filter(Boolean);
    put(el, (pre ? prefillView(pre) : '') + rest.map((f) => showJson(f, '', '')).join('') || '<p class="note">Pas encore de préremplissage ni de reçu : ils apparaissent quand le run atteint le formulaire.</p>');
  }
  else if (tab === 'dossier') put(el, app.length ? `<p class="src">${esc(cache.app.dir)}</p>` + app.map((f) => show(f)).join('') : `<p class="note">Le dossier final (applications/${esc(selected)}/) n'existe pas encore : il est copié quand le run se termine.</p>`);
  else if (tab === 'journal' && run) {
    const r = await api('/api/run/' + encodeURIComponent(run.id) + '/logs');
    put(el, `<pre>${esc((r.lines || []).join('\n'))}</pre>`);
  } else put(el, '');
}

/** `#<slug>` dans l'adresse ouvre l'offre directement (lien depuis Telegram, favori). */
refresh().then(() => { const h = decodeURIComponent(location.hash.slice(1)); if (h && offerOf(h)) { if (view === 'remote' || view === 'signals') view = 'offres'; select(h); } loadRemote(true); loadSignals(true); });
setInterval(async () => { await refresh(); if (view === 'remote') loadRemote(); else if (view === 'signals') loadSignals(); else if (selected && tab !== 'journal' && !(document.activeElement && document.activeElement.matches('#detail textarea'))) loadFiles(); }, 5000);
</script>
</body>
